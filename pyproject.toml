[project]
name = "unwritten-exp"
version = "0.0.1"
description = "Experiments lab for the Unwritten engine — kernels and libraries, built standalone."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "GPL-3.0-only" }
dependencies = [
    "networkx>=3.6.1",
    "numpy>=2.5.1",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["exp", "tests"]
markers = [
    "slow: statistical/property tests with heavy numeric loops (1e5 trials, Monte Carlo). Run with: uv run pytest -m slow",
]
addopts = "-m 'not slow' -n 4"
