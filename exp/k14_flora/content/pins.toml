# pins.toml — K14 flora Tier-1 anchors (K13 pin format).
# Common-cover genus pins (rank = "genus", radiation = authored 3-6)
# anchor the everyday register; landmark species pins (rank = "species",
# no radiation) sit under their binomial genus automatically (K13
# backbone rule). Axis overrides use the M1 registry axis names
# (height_m, leaf_shape, flower_color, ...).

# ──  trees / shrubs  ───────────────────────────────────────────────────
[[pin]]
preset = "tree.oak"
label = "oaks"
name = { binomial = "Quercus", folk = "oak" }
rank = "genus"
radiation = 6
axes = { height_m = 25.0, leaf_shape = "lobed", fruit_type = "nut" }
flags = ["pinned"]

[[pin]]
preset = "tree.conifer"
label = "pines"
name = { binomial = "Pinus", folk = "pine" }
rank = "genus"
radiation = 5
axes = { height_m = 30.0, leaf_shape = "needle", fruit_type = "cone", fire_strategy = "seeder" }
flags = ["pinned"]

[[pin]]
preset = "tree.birch"
label = "birches"
name = { binomial = "Betula", folk = "birch" }
rank = "genus"
radiation = 4
axes = { height_m = 20.0, pioneer_climax = 0.15, fruit_type = "samara" }
flags = ["pinned"]

[[pin]]
preset = "tree.willow"
label = "willows"
name = { binomial = "Salix", folk = "willow" }
rank = "genus"
radiation = 5
axes = { height_m = 15.0, leaf_shape = "linear", waterlogging_tolerance = 0.8 }
flags = ["pinned"]

[[pin]]
preset = "shrub.bramble"
label = "brambles"
name = { binomial = "Rubus", folk = "bramble" }
rank = "genus"
radiation = 6
axes = { mechanical_defense = "prickle", fruit_type = "aggregate", clonal_spread_m = 3.0 }
