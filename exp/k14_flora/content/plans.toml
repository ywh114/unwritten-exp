           "chemical_alkaloids", "chemical_cardiac", "latex"]
storage = ["none", "tuber", "bulb", "rhizome", "endosperm"]
covering = ["cuticle_waxy", "pubescent", "none"]
phenology = ["evergreen", "winter_deciduous", "drought_deciduous",
