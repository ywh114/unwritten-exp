feeding_organ = ["C3_foliage", "CAM_foliage", "mycoheterotroph"]
signal = ["flower_showy", "flower_inconspicuous"]
dispersal = ["gravity_drop", "fleshy_reward", "hooks_burs", "wind_plume",
             "ballistic", "clonal_spread"]
defense = ["none", "thorns", "spines", "prickles", "chemical_tannins",
           "chemical_alkaloids"]
storage = ["none", "lignotuber", "rhizome", "endosperm"]
covering = ["bark_thin", "cuticle_waxy", "pubescent"]
phenology = ["evergreen", "winter_deciduous", "drought_deciduous"]
sensor_array = ["tropism_standard"]

