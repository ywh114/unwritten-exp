# K14 flora — growth-form plans (M1 PlanSpec format, mirrored from K13).
# "Body plans" here are growth forms (flora RFC §1). phylum = line
# (seed / spore / decomposer); frame = structural grade; class_name =
# latin plural for nomenclature (mirrors fauna class names).
# Generics: dispersal REPLACES locomotor (flora RFC §1); sensor_array =
# tropism (the RESONANT ley hook); everything else mirrors fauna.

[plan.tree]
phylum = "seed"
frame = "vascular"
medium = "land"
class_name = "Arbores"
slots = ["trunk", "crown", "leaf", "root", "display", "fruit", "bark"]
[plan.tree.generics]
support = ["trunk_single", "trunk_multi"]
feeding_organ = ["C3_foliage"]
signal = ["flower_showy", "flower_inconspicuous", "cone_strobilus"]
dispersal = ["gravity_drop", "wind_winged", "wind_plume", "fleshy_reward",
             "hooks_burs", "ballistic"]
defense = ["none", "thorns", "spines", "chemical_tannins",
           "chemical_alkaloids", "chemical_essential_oil"]
storage = ["none", "lignotuber", "endosperm"]
covering = ["bark_thin", "bark_thick", "bark_corky"]
phenology = ["evergreen", "winter_deciduous", "drought_deciduous"]
sensor_array = ["tropism_standard"]

[plan.shrub]
phylum = "seed"
frame = "vascular"
medium = "land"
class_name = "Frutices"
slots = ["stems", "leaf", "root", "display", "fruit"]
[plan.shrub.generics]
