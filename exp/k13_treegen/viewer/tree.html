<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K13 Tree of Life — Viewer</title>
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 13px; line-height: 1.4; color: #222; background: #f8f8f6;
  overflow: hidden; height: 100vh; user-select: none;
}

/* ===== Header ===== */
#header {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 6px 10px; background: #eee; border-bottom: 1px solid #ccc;
  min-height: 36px; user-select: none;
}
#header .seed-badge { font-weight: 700; white-space: nowrap; }
#header .counts { color: #555; font-size: 11px; white-space: nowrap; }
#header button {
  font-size: 11px; padding: 3px 8px; border: 1px solid #aaa; border-radius: 3px;
  background: #fff; cursor: pointer; white-space: nowrap;
}
#header button:hover { background: #e6e6e6; }

/* ===== File-picker overlay ===== */
#file-picker {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.25); z-index: 1000;
  align-items: center; justify-content: center;
}
#file-picker.show { display: flex; }
#file-picker .drop-zone {
  background: #fff; border: 3px dashed #aaa; border-radius: 12px;
  padding: 60px 80px; text-align: center; cursor: pointer;
}
#file-picker .drop-zone.drag-over { border-color: #3498db; background: #eef7fd; }
#file-picker .drop-zone h2 { margin-bottom: 10px; font-weight: 500; }
#file-picker .drop-zone p { color: #777; font-size: 12px; }

/* ===== Canvas ===== */
#canvas-wrap {
  height: calc(100vh - 36px); overflow: hidden; position: relative;
  background: #fdfdfd; cursor: grab;
}
#canvas-wrap.panning { cursor: grabbing; }
#tree-svg {
  width: 100%; height: 100%; display: block;
}

/* ===== Tooltip ===== */
#tooltip {
  position: fixed; z-index: 9999; pointer-events: none;
  display: none; background: #fff; border: 1px solid #888;
  border-radius: 4px; padding: 8px 10px; font-size: 11px; line-height: 1.5;
  max-width: 360px; max-height: 70vh; overflow-y: auto;
  box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  color: #222;
}
#tooltip.show { display: block; }
#tooltip .tt-title { font-weight: 600; font-size: 12px; margin-bottom: 4px; }
#tooltip .tt-row { display: flex; gap: 6px; }
#tooltip .tt-row .tt-k { color: #777; min-width: 130px; flex-shrink: 0; }
#tooltip .tt-row .tt-v { word-break: break-all; }
#tooltip .tt-sep {
  border-top: 1px solid #eee; margin: 4px 0;
}

/* SVG node styling */
.tree-node { cursor: pointer; }
.tree-node circle { stroke: #333; stroke-width: 1; }
.tree-node .collapse-badge { font-size: 9px; fill: #fff; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.tree-node .collapse-badge-bg { fill: #666; }
.tree-edge { stroke: #bbb; stroke-width: 1; fill: none; }

.label-box { pointer-events: none; }
.label-box rect {
  fill: rgba(255,255,255,0.92); stroke: #ccc; stroke-width: 0.8;
  rx: 4; ry: 4;
}
.label-box text {
  font-size: 10px; fill: #333;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
.label-box text.pin-star { fill: #e67e22; }
.tree-node.selected .label-box rect { stroke: #e74c3c; stroke-width: 2; }
.tree-node.selected circle { stroke: #e74c3c; stroke-width: 2.5; }

/* Drag body class */
body.dragging { user-select: none; -webkit-user-select: none; }
</style>
</head>
<body>

<!-- File picker -->
<div id="file-picker">
  <div class="drop-zone" id="drop-zone">
    <h2>Load tree.json</h2>
    <p>Drop a file here or click to browse</p>
    <input type="file" id="file-input" accept=".json" style="display:none">
  </div>
</div>

<!-- Header -->
<div id="header">
  <span class="seed-badge" id="header-seed">No data</span>
  <span class="counts" id="header-counts"></span>
  <button id="btn-reset" title="Collapse to order level">Reset (Order level)</button>
  <button id="btn-fit" title="Zoom to fit">Fit</button>
</div>

<!-- Canvas -->
<div id="canvas-wrap">
  <svg id="tree-svg"><text x="50%" y="50%" text-anchor="middle" fill="#ccc" font-size="14" id="placeholder-text">No tree loaded — drop a tree.json file</text></svg>
</div>

<!-- Tooltip (HTML overlay, z-index above everything) -->
<div id="tooltip"></div>

<script>
(function() {
"use strict";

// ============================================================================
// Constants
// ============================================================================
const RANKS = ["kingdom", "phylum", "class", "order", "family", "genus", "species"];
const RANK_COLORS = ["#E74C3C", "#E67E22", "#F1C40F", "#2ECC71", "#3498DB", "#9B59B6", "#1ABC9C"];
const RANK_NODE_R = [7, 6, 5.5, 5, 4.5, 4, 3.5];
const RANK_X = 140;
const LEAF_DY = 24;
const MARGIN = { top: 30, right: 80, bottom: 30, left: 40 };

// ============================================================================
// State
// ============================================================================
let treeData = null;
let nodeMap = new Map();        // path -> node
let childrenMap = new Map();    // parent -> sorted [child paths]
let roots = [];
let positions = new Map();      // path -> {x, y}
let leafCount = 0;
let collapsed = new Set();
let selectedPath = null;
let tooltipPath = null;         // path being hovered

// Zoom/pan
let zoomScale = 1;
let panX = 0, panY = 0;
let svgEl, svgGroup;

// Dragging state
let isDragging = false;
let dragMoved = false;

// Event binding guard
let svgEventsSetup = false;

// ============================================================================
// Helpers
// ============================================================================
function rankIdx(rank) {
  if (typeof rank === "number") return rank;
  return RANKS.indexOf(rank.toLowerCase());
}

function isPinned(node) {
  return node.flags && node.flags.includes("pinned");
}

function nodeDisplayName(node) {
  if (isPinned(node)) {
    return (node.label || node.name.folk || node.name.binomial || node.path);
  }
  return (node.name.binomial || node.label || node.path);
}

function descendantCount(path) {
  let count = 0;
  function walk(p) {
    count++;
    for (const c of (childrenMap.get(p) || [])) walk(c);
  }
  walk(path);
  return count - 1;
}

// ============================================================================
// Data loading
// ============================================================================
function buildTree(data) {
  treeData = data;
  nodeMap.clear();
  childrenMap.clear();
  roots = [];
  collapsed.clear();
  selectedPath = null;
  tooltipPath = null;
  zoomScale = 1; panX = 0; panY = 0;

  for (const nd of data.nodes) {
    nodeMap.set(nd.path, nd);
    if (!nd.parent) {
      roots.push(nd.path);
    } else {
      if (!childrenMap.has(nd.parent)) childrenMap.set(nd.parent, []);
      childrenMap.get(nd.parent).push(nd.path);
    }
  }
  for (const [p, kids] of childrenMap) {
    kids.sort();
  }
  roots.sort();
}

// ============================================================================
// Layout
// ============================================================================
function computeVisibleLayout() {
  positions.clear();
  leafCount = 0;

  function traverse(path) {
    const node = nodeMap.get(path);
    const r = rankIdx(node.rank);

    if (collapsed.has(path)) {
      positions.set(path, { x: r, y: leafCount });
      leafCount++;
      return;
    }

    const kids = childrenMap.get(path) || [];
    if (kids.length === 0) {
      positions.set(path, { x: r, y: leafCount });
      leafCount++;
      return;
    }

    for (const c of kids) traverse(c);
    const ys = kids.map(c => positions.get(c)).filter(p => p).map(p => p.y);
    const avg = ys.length > 0
      ? ys.reduce((a, b) => a + b, 0) / ys.length
      : leafCount;
    positions.set(path, { x: r, y: avg });
  }

  for (const r of roots) {
    if (leafCount > 0) leafCount++;
    traverse(r);
  }
}

function visibleNodes() {
  const vis = new Set();
  function walk(path, parentCollapsed) {
    if (parentCollapsed) return;
    vis.add(path);
    const kids = childrenMap.get(path) || [];
    for (const c of kids) walk(c, collapsed.has(path));
  }
  for (const r of roots) walk(r, false);
  return vis;
}

// ============================================================================
// SVG Rendering
// ============================================================================
function svgX(lx) { return MARGIN.left + lx * RANK_X; }
function svgY(ly) { return MARGIN.top + ly * LEAF_DY; }
function svgTotalW() { return MARGIN.left + 7 * RANK_X + MARGIN.right; }
function svgTotalH() { return MARGIN.top + Math.max(1, leafCount) * LEAF_DY + MARGIN.bottom; }

function renderTree() {
  computeVisibleLayout();
  svgEl = document.getElementById("tree-svg");
  const ph = document.getElementById("placeholder-text");
  if (ph) ph.remove();

  const totalW = svgTotalW();
  const totalH = svgTotalH();
  svgEl.setAttribute("viewBox", `0 0 ${totalW} ${totalH}`);
  svgEl.setAttribute("preserveAspectRatio", "xMidYMid meet");
  svgEl.removeAttribute("width");
  svgEl.removeAttribute("height");
  svgEl.innerHTML = "";

  svgGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
  svgGroup.setAttribute("id", "svg-group");
  applyTransform();
  svgEl.appendChild(svgGroup);

  const vis = visibleNodes();
  const labelH = 17;  // single row height

  // Draw edges (elbows: horizontal from parent, vertical to child)
  for (const path of vis) {
    const node = nodeMap.get(path);
    if (!node || !node.parent) continue;
    if (!vis.has(node.parent)) continue;
    const pos = positions.get(path);
    const ppos = positions.get(node.parent);
    if (!pos || !ppos) continue;

    const x1 = svgX(ppos.x), y1 = svgY(ppos.y);
    const x2 = svgX(pos.x),   y2 = svgY(pos.y);
    const childR = RANK_NODE_R[rankIdx(node.rank)] || 3;
    const parentR = RANK_NODE_R[rankIdx(nodeMap.get(node.parent).rank)] || 3;

    const edge = document.createElementNS("http://www.w3.org/2000/svg", "path");
    edge.setAttribute("d", `M ${x1 + parentR} ${y1} L ${x2 - childR} ${y1} L ${x2 - childR} ${y2}`);
    edge.setAttribute("class", "tree-edge");
    svgGroup.appendChild(edge);
  }

  // Draw nodes
  for (const path of vis) {
    const node = nodeMap.get(path);
    if (!node) continue;
    const pos = positions.get(path);
    if (!pos) continue;

    const cx = svgX(pos.x), cy = svgY(pos.y);
    const ri = rankIdx(node.rank);
    const r = RANK_NODE_R[ri] || 3;
    const color = RANK_COLORS[ri] || "#999";
    const pinned = isPinned(node);

    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("class", "tree-node" + (path === selectedPath ? " selected" : ""));
    g.setAttribute("data-path", path);

    // Circle
    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    circle.setAttribute("cx", cx); circle.setAttribute("cy", cy);
    circle.setAttribute("r", r); circle.setAttribute("fill", color);
    g.appendChild(circle);

    // Collapse badge
    if (collapsed.has(path)) {
      const count = descendantCount(path);
      const badgeR = 8;
      const bx = cx - r - badgeR - 2, by = cy;
      const bg = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      bg.setAttribute("cx", bx); bg.setAttribute("cy", by); bg.setAttribute("r", badgeR);
      bg.setAttribute("class", "collapse-badge-bg");
      g.appendChild(bg);
      const bt = document.createElementNS("http://www.w3.org/2000/svg", "text");
      bt.textContent = String(count);
      bt.setAttribute("x", bx); bt.setAttribute("y", by);
      bt.setAttribute("class", "collapse-badge");
      g.appendChild(bt);
    }

    // Label box (single-row for all nodes, with ellipsis for unselected)
    const name = nodeDisplayName(node);
    const prefix = pinned ? "★ " : "";
    const fullText = prefix + name;
    const padX = 6, padY = 3;
    const maxChars = 40;
    let displayText = fullText.length > maxChars ? fullText.substring(0, maxChars - 1) + "…" : fullText;
    const estW = Math.max(displayText.length * 6 + padX * 2 + 4, 50);
    const boxH = labelH;
    const boxX = cx + r + 5, boxY = cy - boxH / 2;

    // Label box group
    const lb = document.createElementNS("http://www.w3.org/2000/svg", "g");
    lb.setAttribute("class", "label-box");
    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute("x", boxX); rect.setAttribute("y", boxY);
    rect.setAttribute("width", estW); rect.setAttribute("height", boxH);
    lb.appendChild(rect);
    const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
    txt.setAttribute("x", boxX + padX); txt.setAttribute("y", boxY + padY + 10);
    if (pinned) {
      const star = document.createElementNS("http://www.w3.org/2000/svg", "tspan");
      star.textContent = "★ "; star.setAttribute("class", "pin-star");
      txt.appendChild(star);
      const nameT = document.createElementNS("http://www.w3.org/2000/svg", "tspan");
      nameT.textContent = name.length > maxChars - 2 ? name.substring(0, maxChars - 3) + "…" : name;
      txt.appendChild(nameT);
    } else {
      txt.textContent = displayText;
    }
    lb.appendChild(txt);
    g.appendChild(lb);

    svgGroup.appendChild(g);
  }
}

function applyTransform() {
  if (!svgGroup) return;
  svgGroup.setAttribute("transform", `translate(${panX},${panY}) scale(${zoomScale})`);
}

// ============================================================================
// Tooltip (HTML overlay)
// ============================================================================
const tooltipEl = document.getElementById("tooltip");

function renderTooltip(path, clientX, clientY) {
  const node = nodeMap.get(path);
  if (!node) return;

  let html = "";
  const name = nodeDisplayName(node);
  const pinned = isPinned(node);

  // Title
  html += `<div class="tt-title">${pinned ? "★ " : ""}${name}</div>`;
  html += `<div class="tt-row"><span class="tt-k">path</span><span class="tt-v">${esc(node.path)}</span></div>`;
  html += `<div class="tt-row"><span class="tt-k">rank</span><span class="tt-v">${esc(node.rank)}</span></div>`;
  if (node.parent) html += `<div class="tt-row"><span class="tt-k">parent</span><span class="tt-v">${esc(node.parent)}</span></div>`;
  if (node.label && !pinned) html += `<div class="tt-row"><span class="tt-k">label</span><span class="tt-v">${esc(node.label)}</span></div>`;
  if (pinned && node.name.folk) html += `<div class="tt-row"><span class="tt-k">folk name</span><span class="tt-v">${esc(node.name.folk)}</span></div>`;
  if (pinned && node.name.binomial) html += `<div class="tt-row"><span class="tt-k">binomial</span><span class="tt-v"><i>${esc(node.name.binomial)}</i></span></div>`;
  html += `<div class="tt-row"><span class="tt-k">g</span><span class="tt-v">${typeof node.g === "number" ? node.g.toFixed(4) : "—"}</span></div>`;

  // Axes — sorted alphabetically, N/A hidden, diet_spectrum special
  if (node.axes && typeof node.axes === "object") {
    const axesEntries = Object.entries(node.axes)
      .filter(([, v]) => v !== "N/A" && v !== null && v !== undefined)
      .sort((a, b) => a[0].localeCompare(b[0]));

    if (axesEntries.length > 0) {
      html += `<div class="tt-sep"></div>`;
      html += `<div style="font-weight:600;margin-bottom:2px;">Axes</div>`;
      for (const [k, v] of axesEntries) {
        if (k === "diet_spectrum" && v && typeof v === "object") {
          // diet_spectrum: "guild weight%" sorted by weight desc
          const ds = Object.entries(v)
            .filter(([, w]) => w > 0)
            .sort((a, b) => b[1] - a[1])
            .map(([g, w]) => `${g} ${Number(w).toFixed(0)}%`)
            .join(", ");
          html += `<div class="tt-row"><span class="tt-k">${esc(k)}</span><span class="tt-v">${esc(ds)}</span></div>`;
        } else {
          html += `<div class="tt-row"><span class="tt-k">${esc(k)}</span><span class="tt-v">${esc(String(v))}</span></div>`;
        }
      }
    }
  }

  // Generics
  if (node.generics && typeof node.generics === "object" && Object.keys(node.generics).length > 0) {
    html += `<div class="tt-sep"></div>`;
    html += `<div style="font-weight:600;margin-bottom:2px;">Generics</div>`;
    for (const [k, v] of Object.entries(node.generics).sort((a, b) => a[0].localeCompare(b[0]))) {
      html += `<div class="tt-row"><span class="tt-k">${esc(k)}</span><span class="tt-v">${esc(String(v))}</span></div>`;
    }
  }

  // Flags
  if (node.flags && node.flags.length > 0) {
    html += `<div class="tt-sep"></div>`;
    html += `<div style="font-weight:600;margin-bottom:2px;">Flags</div>`;
    html += `<div>${node.flags.map(f => `<span style="display:inline-block;font-size:10px;padding:1px 5px;border-radius:3px;margin:1px 2px;background:#d5f5e3;color:#1e8449;">${esc(f)}</span>`).join("")}</div>`;
  }

  tooltipEl.innerHTML = html;
  tooltipEl.classList.add("show");

  // Position: offset from cursor
  let tx = clientX + 14, ty = clientY + 14;
  const tw = tooltipEl.offsetWidth, th = tooltipEl.offsetHeight;
  if (tx + tw > window.innerWidth - 10) tx = clientX - tw - 14;
  if (ty + th > window.innerHeight - 10) ty = clientY - th - 14;
  if (tx < 5) tx = 5;
  if (ty < 5) ty = 5;
  tooltipEl.style.left = tx + "px";
  tooltipEl.style.top = ty + "px";
}

function hideTooltip() {
  tooltipEl.classList.remove("show");
}

function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// ============================================================================
// Node interaction
// ============================================================================
function onNodeClick(path) {
  const node = nodeMap.get(path);
  if (!node) return;
  const kids = childrenMap.get(path);

  if (kids && kids.length > 0 && collapsed.has(path)) {
    // Expand
    collapsed.delete(path);
    selectNode(path);
    renderTree();
  } else if (kids && kids.length > 0 && !collapsed.has(path)) {
    // Already expanded: just select
    selectNode(path);
    renderTree();
  } else {
    // Leaf or no children: just select
    selectNode(path);
    renderTree();
  }
}

function onNodeDblClick(path) {
  const node = nodeMap.get(path);
  if (!node) return;
  const kids = childrenMap.get(path);
  if (!kids || kids.length === 0) return;
  // Collapse
  if (!collapsed.has(path)) {
    collapsed.add(path);
    // If selection is inside collapsed subtree, move selection up
    if (selectedPath && isDescendantOf(selectedPath, path)) {
      selectedPath = path;
    }
    renderTree();
  }
}

function isDescendantOf(childPath, ancestorPath) {
  return childPath === ancestorPath || (childPath && childPath.startsWith(ancestorPath + "."));
}

function selectNode(path) {
  selectedPath = path;
}

// ============================================================================
// Zoom / Pan
// ============================================================================
function setupZoomPan() {
  const wrap = document.getElementById("canvas-wrap");

  wrap.addEventListener("wheel", function(e) {
    e.preventDefault();
    const rect = wrap.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const factor = e.deltaY < 0 ? 1.1 : 0.9;
    const newScale = Math.max(0.1, Math.min(10, zoomScale * factor));
    panX = mx - (mx - panX) * (newScale / zoomScale);
    panY = my - (my - panY) * (newScale / zoomScale);
    zoomScale = newScale;
    applyTransform();
  }, { passive: false });

  // Mouse events on canvas
  wrap.addEventListener("mousedown", function(e) {
    if (e.button !== 0) return;
    // Don't start drag on node clicks — nodes are handled separately
    if (e.target.closest(".tree-node")) return;
    isDragging = true;
    dragMoved = false;
    wrap.classList.add("panning");
    document.body.classList.add("dragging");
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    dragPanX = panX;
    dragPanY = panY;
    window.getSelection().removeAllRanges();
  });

  window.addEventListener("mousemove", function(e) {
    if (!isDragging) return;
    const dx = e.clientX - dragStartX;
    const dy = e.clientY - dragStartY;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) dragMoved = true;
    panX = dragPanX + dx;
    panY = dragPanY + dy;
    applyTransform();
  });

  window.addEventListener("mouseup", function() {
    const wasDragging = isDragging;
    isDragging = false;
    document.getElementById("canvas-wrap").classList.remove("panning");
    document.body.classList.remove("dragging");
    if (wasDragging && !dragMoved) {
      // Click on empty canvas: deselect
      selectedPath = null;
      hideTooltip();
      renderTree();
    }
  });
}

let dragStartX, dragStartY, dragPanX, dragPanY;

// ============================================================================
// SVG event delegation (click, dblclick, hover, mousemove for tooltip)
// ============================================================================
function setupSVGEvents() {
  if (svgEventsSetup) return;
  svgEventsSetup = true;

  svgEl.addEventListener("click", function(e) {
    const nodeEl = e.target.closest(".tree-node");
    if (!nodeEl) return;
    e.stopPropagation();
    const path = nodeEl.getAttribute("data-path");
    if (path) onNodeClick(path);
  });

  svgEl.addEventListener("dblclick", function(e) {
    const nodeEl = e.target.closest(".tree-node");
    if (!nodeEl) return;
    e.stopPropagation();
    const path = nodeEl.getAttribute("data-path");
    if (path) onNodeDblClick(path);
  });

  svgEl.addEventListener("mousemove", function(e) {
    const nodeEl = e.target.closest(".tree-node");
    if (nodeEl) {
      const path = nodeEl.getAttribute("data-path");
      if (path && path !== tooltipPath) {
        tooltipPath = path;
        renderTooltip(path, e.clientX, e.clientY);
      }
    } else {
      if (tooltipPath !== null) {
        tooltipPath = null;
        hideTooltip();
      }
    }
  });

  svgEl.addEventListener("mouseleave", function() {
    tooltipPath = null;
    hideTooltip();
  });
}

// ============================================================================
// Keyboard navigation (arrows only — no collapse toggle)
// ============================================================================
function setupKeyboard() {
  document.addEventListener("keydown", function(e) {
    if (!selectedPath) return;
    if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA") return;

    const node = nodeMap.get(selectedPath);
    if (!node) return;
    let newSel = null;

    switch (e.key) {
      case "ArrowLeft":
        e.preventDefault();
        if (node.parent) newSel = node.parent;
        break;
      case "ArrowRight":
        e.preventDefault();
        // Move to first visible child
        if (!collapsed.has(selectedPath)) {
          const kids = childrenMap.get(selectedPath) || [];
          if (kids.length > 0) newSel = kids[0];
        }
        break;
      case "ArrowUp":
        e.preventDefault();
        newSel = prevSibling(selectedPath);
        break;
      case "ArrowDown":
        e.preventDefault();
        newSel = nextSibling(selectedPath);
        break;
    }

    if (newSel && newSel !== selectedPath) {
      selectedPath = newSel;
      renderTree();
      // Update tooltip position to selected node
      updateTooltipForSelection();
    }
  });
}

function prevSibling(path) {
  const node = nodeMap.get(path);
  if (!node || !node.parent) return null;
  const sibs = childrenMap.get(node.parent) || [];
  const idx = sibs.indexOf(path);
  if (idx > 0) return sibs[idx - 1];
  return null;
}

function nextSibling(path) {
  const node = nodeMap.get(path);
  if (!node || !node.parent) return null;
  const sibs = childrenMap.get(node.parent) || [];
  const idx = sibs.indexOf(path);
  if (idx >= 0 && idx < sibs.length - 1) return sibs[idx + 1];
  return null;
}

function updateTooltipForSelection() {
  if (!selectedPath) { hideTooltip(); return; }
  const g = svgGroup.querySelector(`.tree-node[data-path="${CSS.escape(selectedPath)}"]`);
  if (!g) { hideTooltip(); return; }
  const rect = g.getBoundingClientRect();
  renderTooltip(selectedPath, rect.right, rect.top);
}

// ============================================================================
// Zoom to fit
// ============================================================================
function zoomToFit() {
  const wrap = document.getElementById("canvas-wrap");
  if (!wrap || !svgGroup) return;
  const rect = wrap.getBoundingClientRect();
  const cw = rect.width, ch = rect.height;
  if (cw <= 0 || ch <= 0) return;

  const circles = svgGroup.querySelectorAll(".tree-node circle");
  if (circles.length === 0) return;

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  circles.forEach(c => {
    const cx = parseFloat(c.getAttribute("cx"));
    const cy = parseFloat(c.getAttribute("cy"));
    const r = parseFloat(c.getAttribute("r")) || 3;
    if (isNaN(cx) || isNaN(cy)) return;
    minX = Math.min(minX, cx - r);
    minY = Math.min(minY, cy - r);
    maxX = Math.max(maxX, cx + r);
    maxY = Math.max(maxY, cy + r);
  });
  if (!isFinite(minX)) return;

  const bw = maxX - minX || 1, bh = maxY - minY || 1;
  const pad = 40;
  const sx = (cw - pad * 2) / bw;
  const sy = (ch - pad * 2) / bh;
  zoomScale = Math.min(sx, sy, 2.0);
  panX = (cw - bw * zoomScale) / 2 - minX * zoomScale;
  panY = (ch - bh * zoomScale) / 2 - minY * zoomScale;
  applyTransform();
}

// ============================================================================
// Rank-based collapse/expand — collapse AT given rank
// ============================================================================
function collapseAtRank(rankName) {
  collapsed.clear();
  const targetIdx = RANKS.indexOf(rankName);
  for (const path of nodeMap.keys()) {
    const node = nodeMap.get(path);
    const ri = rankIdx(node.rank);
    const kids = childrenMap.get(path) || [];
    if (ri === targetIdx && kids.length > 0) {
      collapsed.add(path);
    }
  }
}

// ============================================================================
// File loading (UI)
// ============================================================================
function setupFilePicker() {
  const picker = document.getElementById("file-picker");
  const dropZone = document.getElementById("drop-zone");
  const fileInput = document.getElementById("file-input");

  dropZone.addEventListener("click", function() { fileInput.click(); });

  fileInput.addEventListener("change", function() {
    const file = fileInput.files[0];
    if (file) loadFromFile(file);
  });

  dropZone.addEventListener("dragover", function(e) {
    e.preventDefault();
    dropZone.classList.add("drag-over");
  });

  dropZone.addEventListener("dragleave", function() {
    dropZone.classList.remove("drag-over");
  });

  dropZone.addEventListener("drop", function(e) {
    e.preventDefault();
    dropZone.classList.remove("drag-over");
    const file = e.dataTransfer.files[0];
    if (file) loadFromFile(file);
  });

  // Also allow whole-page drop
  document.addEventListener("dragover", function(e) { e.preventDefault(); });
  document.addEventListener("drop", function(e) {
    e.preventDefault();
    const file = e.dataTransfer.files[0];
    if (file && file.name.endsWith(".json")) loadFromFile(file);
  });
}

function loadFromFile(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.meta || !data.nodes) {
        alert("Invalid tree file: missing meta or nodes");
        return;
      }
      loadTree(data);
      hideFilePicker();
    } catch (err) {
      alert("Failed to parse JSON: " + err.message);
    }
  };
  reader.readAsText(file);
}

function hideFilePicker() {
  document.getElementById("file-picker").classList.remove("show");
}

// ============================================================================
// Full load pipeline
// ============================================================================
function loadTree(data) {
  buildTree(data);

  // Header
  const meta = data.meta || {};
  document.getElementById("header-seed").textContent = "Seed " + (meta.seed !== undefined ? meta.seed : "?");
  const c = meta.counts || {};
  document.getElementById("header-counts").textContent =
    RANKS.map(r => `${r[0].toUpperCase()}:${c[r] || 0}`).join("  ");

  // Hide the file-picker overlay (any load path)
  hideFilePicker();

  // Default: collapse everything below order (collapsed at order level)
  collapseAtRank("order");
  selectedPath = null;
  tooltipPath = null;

  svgEl = document.getElementById("tree-svg");
  renderTree();
  setupSVGEvents();
  zoomToFit();
}

// ============================================================================
// Programmatic API
// ============================================================================
window.loadTree = function(jsonObject) {
  if (!jsonObject || !jsonObject.meta || !jsonObject.nodes) {
    console.error("loadTree: invalid tree object");
    return;
  }
  loadTree(jsonObject);
};

window.getVisibleNodeCount = function() {
  return visibleNodes().size;
};

window.getSelectedPath = function() {
  return selectedPath;
};

// ============================================================================
// Init
// ============================================================================
function init() {
  svgEl = document.getElementById("tree-svg");

  setupFilePicker();
  setupKeyboard();

  // Reset button
  document.getElementById("btn-reset").addEventListener("click", function() {
    collapsed.clear();
    collapseAtRank("order");
    selectedPath = null;
    tooltipPath = null;
    hideTooltip();
    zoomScale = 1; panX = 0; panY = 0;
    applyTransform();
    renderTree();
    zoomToFit();
  });

  // Fit button
  document.getElementById("btn-fit").addEventListener("click", zoomToFit);

  // On first render, we need to handle svgEl for events. But svgEl may be
  // recreated by renderTree. We'll defer event binding to after first render.
  // For now, show the file picker.
  document.getElementById("file-picker").classList.add("show");

  setupZoomPan();
}

document.addEventListener("DOMContentLoaded", init);

})();
</script>
