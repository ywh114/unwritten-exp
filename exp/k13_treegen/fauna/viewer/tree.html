<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K13 Tree of Life — Viewer</title>
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 13px; line-height: 1.4; color: #222; background: #f8f8f6;
  overflow: hidden; height: 100vh; user-select: none;
  display: flex; flex-direction: column;
}

/* ===== Header ===== */
#header {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 6px 10px; background: #eee; border-bottom: 1px solid #ccc;
  min-height: 36px; user-select: none; flex-shrink: 0;
}
#header .seed-badge { font-weight: 700; white-space: nowrap; }
#header .counts { color: #555; font-size: 11px; white-space: nowrap; }
#header button {
  font-size: 11px; padding: 3px 8px; border: 1px solid #aaa; border-radius: 3px;
  background: #fff; cursor: pointer; white-space: nowrap;
}
#header button:hover { background: #e6e6e6; }

/* ===== File-picker overlay ===== */
#file-picker {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.25); z-index: 1000;
  align-items: center; justify-content: center;
}
#file-picker.show { display: flex; }
#file-picker .drop-zone {
  background: #fff; border: 3px dashed #aaa; border-radius: 12px;
  padding: 60px 80px; text-align: center; cursor: pointer;
}
#file-picker .drop-zone.drag-over { border-color: #3498db; background: #eef7fd; }
#file-picker .drop-zone h2 { margin-bottom: 10px; font-weight: 500; }
#file-picker .drop-zone p { color: #777; font-size: 12px; }

/* ===== Main row ===== */
#main-row {
  display: flex; flex: 1; overflow: hidden;
}

/* ===== Canvas ===== */
#canvas-wrap {
  flex: 1; overflow: hidden; position: relative;
  background: #fdfdfd; cursor: grab;
}
#canvas-wrap.panning { cursor: grabbing; }
#tree-canvas {
  display: block; position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
}

/* ===== Sidebar ===== */
#sidebar {
  width: 320px; min-width: 320px; overflow-y: auto;
  border-left: 1px solid #ccc; padding: 10px 12px;
  font-size: 12px; line-height: 1.5; user-select: text;
  background: #fafafa;
}
#sidebar .sk { color: #777; min-width: 90px; display: inline-block; }
#sidebar::-webkit-scrollbar { width: 6px; }
#sidebar::-webkit-scrollbar-track { background: transparent; }
#sidebar::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

/* Drag body class */
body.dragging { user-select: none; -webkit-user-select: none; }
</style>
</head>
<body>

<!-- File picker -->
<div id="file-picker">
  <div class="drop-zone" id="drop-zone">
    <h2>Load tree.json</h2>
    <p>Drop a file here or click to browse</p>
    <input type="file" id="file-input" accept=".json" style="display:none">
  </div>
</div>

<!-- Header -->
<div id="header">
  <span class="seed-badge" id="header-seed">No data</span>
  <span class="counts" id="header-counts"></span>
  <button id="btn-reset" title="Collapse to order level">Reset (Order level)</button>
  <button id="btn-fit" title="Zoom to fit">Fit</button>
</div>

<!-- Main row: canvas + sidebar -->
<div id="main-row">
  <div id="canvas-wrap">
    <canvas id="tree-canvas"></canvas>
  </div>
  <div id="sidebar">
    <p style="color:#999;font-style:italic;">Click a node to see details</p>
  </div>
</div>

<script>
(function() {
"use strict";

// ============================================================================
// Constants
// ============================================================================
const RANKS = ["kingdom", "phylum", "class", "order", "family", "genus", "species"];
const RANK_COLORS = ["#E74C3C", "#E67E22", "#F1C40F", "#2ECC71", "#3498DB", "#9B59B6", "#1ABC9C"];
const RANK_NODE_R = [7, 6, 5.5, 5, 4.5, 4, 3.5];
const RANK_X = 140;
const LEAF_DY = 24;
const MARGIN = { top: 30, right: 80, bottom: 30, left: 40 };

// ============================================================================
// State
// ============================================================================
let treeData = null;
let nodeMap = new Map();        // path -> node
let childrenMap = new Map();    // parent -> sorted [child paths]
let roots = [];
let positions = new Map();      // path -> {x, y}
let leafCount = 0;
let collapsed = new Set();
let selectedPath = null;

// Zoom/pan
let zoomScale = 1;
let panX = 0, panY = 0;

// Canvas
let canvas, ctx;
let dirty = false;
let hitRegions = new Map();     // path -> {cx, cy, r, bx, by, bw, bh}

// Dragging state
let isDragging = false;
let dragMoved = false;
let dragStartX, dragStartY, dragPanX, dragPanY;

// Click timer for single vs double click
let pendingClick = null;        // {path, timer}

// ============================================================================
// Helpers
// ============================================================================
function rankIdx(rank) {
  if (typeof rank === "number") return rank;
  return RANKS.indexOf(rank.toLowerCase());
}

function isPinned(node) {
  return node.flags && node.flags.includes("pinned");
}

function nodeDisplayName(node) {
  if (isPinned(node)) {
    return (node.label || node.name.folk || node.name.binomial || node.path);
  }
  return (node.name.binomial || node.label || node.path);
}

function descendantCount(path) {
  let count = 0;
  function walk(p) {
    count++;
    for (const c of (childrenMap.get(p) || [])) walk(c);
  }
  walk(path);
  return count - 1;
}

function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// ============================================================================
// Data loading
// ============================================================================
function buildTree(data) {
  treeData = data;
  nodeMap.clear();
  childrenMap.clear();
  roots = [];
  collapsed.clear();
  selectedPath = null;
  zoomScale = 1; panX = 0; panY = 0;

  for (const nd of data.nodes) {
    nodeMap.set(nd.path, nd);
    if (!nd.parent) {
      roots.push(nd.path);
    } else {
      if (!childrenMap.has(nd.parent)) childrenMap.set(nd.parent, []);
      childrenMap.get(nd.parent).push(nd.path);
    }
  }
  for (const [p, kids] of childrenMap) {
    kids.sort();
  }
  roots.sort();
}

// ============================================================================
// Layout
// ============================================================================
function computeVisibleLayout() {
  positions.clear();
  leafCount = 0;

  function traverse(path) {
    const node = nodeMap.get(path);
    const r = rankIdx(node.rank);

    if (collapsed.has(path)) {
      positions.set(path, { x: r, y: leafCount });
      leafCount++;
      return;
    }

    const kids = childrenMap.get(path) || [];
    if (kids.length === 0) {
      positions.set(path, { x: r, y: leafCount });
      leafCount++;
      return;
    }

    for (const c of kids) traverse(c);
    const ys = kids.map(c => positions.get(c)).filter(p => p).map(p => p.y);
    const avg = ys.length > 0
      ? ys.reduce((a, b) => a + b, 0) / ys.length
      : leafCount;
    positions.set(path, { x: r, y: avg });
  }

  for (const r of roots) {
    if (leafCount > 0) leafCount++;
    traverse(r);
  }
}

function visibleNodes() {
  const vis = new Set();
  function walk(path, parentCollapsed) {
    if (parentCollapsed) return;
    vis.add(path);
    const kids = childrenMap.get(path) || [];
    for (const c of kids) walk(c, collapsed.has(path));
  }
  for (const r of roots) walk(r, false);
  return vis;
}

// ============================================================================
// Layout helpers
// ============================================================================
function svgX(lx) { return MARGIN.left + lx * RANK_X; }
function svgY(ly) { return MARGIN.top + ly * LEAF_DY; }
function svgTotalW() { return MARGIN.left + 7 * RANK_X + MARGIN.right; }
function svgTotalH() { return MARGIN.top + Math.max(1, leafCount) * LEAF_DY + MARGIN.bottom; }

// ============================================================================
// Canvas rendering
// ============================================================================
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function draw() {
  if (!dirty) return;
  if (!ctx || !canvas) return;

  computeVisibleLayout();

  const w = canvas.width, h = canvas.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, w, h);

  ctx.setTransform(zoomScale, 0, 0, zoomScale, panX, panY);

  hitRegions.clear();
  const vis = visibleNodes();
  const labelH = 17;
  const labelPadX = 6;
  const labelPadY = 3;
  const maxChars = 40;
  const FONT = '10px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';

  // Draw edges
  ctx.strokeStyle = "#bbb";
  ctx.lineWidth = 1;
  for (const path of vis) {
    const node = nodeMap.get(path);
    if (!node || !node.parent) continue;
    if (!vis.has(node.parent)) continue;
    const pos = positions.get(path);
    const ppos = positions.get(node.parent);
    if (!pos || !ppos) continue;

    const x1 = svgX(ppos.x), y1 = svgY(ppos.y);
    const x2 = svgX(pos.x),   y2 = svgY(pos.y);
    const childR = RANK_NODE_R[rankIdx(node.rank)] || 3;
    const parentR = RANK_NODE_R[rankIdx(nodeMap.get(node.parent).rank)] || 3;

    ctx.beginPath();
    ctx.moveTo(x1 + parentR, y1);
    ctx.lineTo(x2 - childR, y1);
    ctx.lineTo(x2 - childR, y2);
    ctx.stroke();
  }

  // Draw nodes
  for (const path of vis) {
    const node = nodeMap.get(path);
    if (!node) continue;
    const pos = positions.get(path);
    if (!pos) continue;

    const cx = svgX(pos.x), cy = svgY(pos.y);
    const ri = rankIdx(node.rank);
    const r = Math.max(RANK_NODE_R[ri] || 3, 7 / zoomScale);
    const color = RANK_COLORS[ri] || "#999";
    const pinned = isPinned(node);
    const isSel = (path === selectedPath);

    // Circle
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = isSel ? "#e74c3c" : "#333";
    ctx.lineWidth = isSel ? 2.5 : 1;
    ctx.stroke();

    // Collapse badge
    if (collapsed.has(path)) {
      const count = descendantCount(path);
      const badgeR = 8;
      const bx = cx - r - badgeR - 2, by = cy;
      ctx.beginPath();
      ctx.arc(bx, by, badgeR, 0, Math.PI * 2);
      ctx.fillStyle = "#666";
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "9px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(String(count), bx, by);
    }

    // Label
    const name = nodeDisplayName(node);
    const prefix = pinned ? "★ " : "";
    const fullText = prefix + name;
    let displayText = fullText.length > maxChars
      ? fullText.substring(0, maxChars - 1) + "\u2026"
      : fullText;
    const estW = Math.max(displayText.length * 6 + labelPadX * 2 + 4, 50);
    const boxX = cx + r + 5, boxY = cy - labelH / 2;

    // Label background
    roundRect(ctx, boxX, boxY, estW, labelH, 4);
    ctx.fillStyle = "rgba(255,255,255,0.92)";
    ctx.fill();
    ctx.strokeStyle = isSel ? "#e74c3c" : "#ccc";
    ctx.lineWidth = isSel ? 2 : 0.8;
    ctx.stroke();

    // Label text
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.font = FONT;
    if (pinned) {
      ctx.fillStyle = "#e67e22";
      ctx.fillText("★ ", boxX + labelPadX, boxY + labelPadY);
      const nameText = name.length > maxChars - 2
        ? name.substring(0, maxChars - 3) + "\u2026"
        : name;
      ctx.fillStyle = "#333";
      ctx.fillText(nameText, boxX + labelPadX + 12, boxY + labelPadY);
    } else {
      ctx.fillStyle = "#333";
      ctx.fillText(displayText, boxX + labelPadX, boxY + labelPadY);
    }

    // Record hit region
    hitRegions.set(path, {
      cx, cy, r,
      bx: boxX, by: boxY, bw: estW, bh: labelH
    });
  }

  dirty = false;
}

// ============================================================================
// Sidebar
// ============================================================================
function renderSidebar() {
  const sidebar = document.getElementById("sidebar");
  if (!selectedPath) {
    sidebar.innerHTML = '<p style="color:#999;font-style:italic;">Click a node to see details</p>';
    return;
  }
  const node = nodeMap.get(selectedPath);
  if (!node) {
    sidebar.innerHTML = '<p style="color:#999;font-style:italic;">Click a node to see details</p>';
    return;
  }

  let html = "";
  const name = nodeDisplayName(node);
  const pinned = isPinned(node);

  html += '<div style="font-weight:600;font-size:13px;margin-bottom:6px;">'
    + (pinned ? "★ " : "") + esc(name) + '</div>';

  // Description (species one-liner) — italic, above the metadata rows
  if (node.description && typeof node.description === "string" && node.description.trim() !== "") {
    html += '<p style="font-style:italic;color:#555;margin-bottom:6px;">' + esc(node.description) + '</p>';
  }

  const row = (k, v) =>
    '<div style="margin-bottom:2px;"><span class="sk">' + esc(k) + '</span> ' + v + '</div>';

  html += row("path", esc(node.path));
  html += row("rank", esc(node.rank));
  if (node.parent) html += row("parent", esc(node.parent));
  if (node.label && !pinned) html += row("label", esc(node.label));
  html += row("folk name", pinned && node.name.folk ? esc(node.name.folk) : "—");
  html += row("binomial", node.name.binomial
    ? (pinned ? '<i>' + esc(node.name.binomial) + '</i>' : esc(node.name.binomial))
    : "—");
  html += row("g", typeof node.g === "number" ? node.g.toFixed(4) : "—");

  // Axes — sorted alphabetically, N/A hidden, diet_spectrum special
  if (node.axes && typeof node.axes === "object") {
    const axesEntries = Object.entries(node.axes)
      .filter(([, v]) => v !== "N/A" && v !== null && v !== undefined)
      .sort((a, b) => a[0].localeCompare(b[0]));

    if (axesEntries.length > 0) {
      html += '<hr style="border:none;border-top:1px solid #eee;margin:6px 0;">';
      html += '<div style="font-weight:600;margin-bottom:2px;">Axes</div>';
      for (const [k, v] of axesEntries) {
        if (v && typeof v === "object") {
          // weighted-set axes (diet_spectrum, dispersal_channels, ...):
          // sorted percentage breakdown, not "[object Object]"
          const ds = Object.entries(v)
            .filter(([, w]) => w > 0)
            .sort((a, b) => b[1] - a[1])
            .map(([g, w]) => g + " " + (w * 100).toFixed(0) + "%")
            .join(", ");
          html += row(k, esc(ds));
        } else {
          html += row(k, esc(String(v)));
        }
      }
    }
  }

  // Generics
  if (node.generics && typeof node.generics === "object" && Object.keys(node.generics).length > 0) {
    html += '<hr style="border:none;border-top:1px solid #eee;margin:6px 0;">';
    html += '<div style="font-weight:600;margin-bottom:2px;">Generics</div>';
    for (const [k, v] of Object.entries(node.generics).sort((a, b) => a[0].localeCompare(b[0]))) {
      html += row(k, esc(String(v)));
    }
  }

  // Flags
  if (node.flags && node.flags.length > 0) {
    html += '<hr style="border:none;border-top:1px solid #eee;margin:6px 0;">';
    html += '<div style="font-weight:600;margin-bottom:2px;">Flags</div>';
    html += '<div>' + node.flags.map(f =>
      '<span style="display:inline-block;font-size:10px;padding:1px 5px;border-radius:3px;margin:1px 2px;background:#d5f5e3;color:#1e8449;">'
      + esc(f) + '</span>'
    ).join("") + '</div>';
  }

  sidebar.innerHTML = html;
}

// ============================================================================
// Node interaction
// ============================================================================
function onNodeClick(path) {
  const node = nodeMap.get(path);
  if (!node) return;
  const kids = childrenMap.get(path);

  if (kids && kids.length > 0 && collapsed.has(path)) {
    // Expand
    collapsed.delete(path);
    selectNode(path);
  } else if (kids && kids.length > 0 && !collapsed.has(path)) {
    // Already expanded: just select
    selectNode(path);
  } else {
    // Leaf or no children: just select
    selectNode(path);
  }
  dirty = true;
  draw();
  renderSidebar();
}

function onNodeDblClick(path) {
  const node = nodeMap.get(path);
  if (!node) return;
  const kids = childrenMap.get(path);
  if (!kids || kids.length === 0) return;
  // Collapse
  if (!collapsed.has(path)) {
    collapsed.add(path);
    // If selection is inside collapsed subtree, move selection up
    if (selectedPath && isDescendantOf(selectedPath, path)) {
      selectedPath = path;
    }
    dirty = true;
    draw();
    renderSidebar();
  }
}

function isDescendantOf(childPath, ancestorPath) {
  return childPath === ancestorPath || (childPath && childPath.startsWith(ancestorPath + "."));
}

function selectNode(path) {
  selectedPath = path;
}

// ============================================================================
// Hit-testing
// ============================================================================
function hitTest(worldX, worldY) {
  // Collect all candidates, pick the closest circle hit or the best label-box hit
  let bestDist = Infinity, bestPath = null;
  for (const [path, region] of hitRegions) {
    // Circle hit — prefer closest
    const dx = worldX - region.cx, dy = worldY - region.cy;
    const dist = dx * dx + dy * dy;
    const r2 = (region.r + 1) * (region.r + 1);
    if (dist < r2 && dist < bestDist) { bestDist = dist; bestPath = path; }
  }
  if (bestPath) return bestPath;
  // Fall back to label-box hit (closest center x)
  for (const [path, region] of hitRegions) {
    if (worldX >= region.bx && worldX <= region.bx + region.bw &&
        worldY >= region.by && worldY <= region.by + region.bh) {
      const dx = Math.abs(worldX - (region.bx + region.bw / 2));
      if (dx < bestDist) { bestDist = dx; bestPath = path; }
    }
  }
  return bestPath;
}

// ============================================================================
// Zoom / Pan
// ============================================================================
function setupZoomPan() {
  const wrap = document.getElementById("canvas-wrap");
  const canvasEl = document.getElementById("tree-canvas");

  // Wheel zoom
  wrap.addEventListener("wheel", function(e) {
    e.preventDefault();
    const rect = canvasEl.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const factor = e.deltaY < 0 ? 1.1 : 0.9;
    const newScale = Math.max(0.1, Math.min(10, zoomScale * factor));
    panX = mx - (mx - panX) * (newScale / zoomScale);
    panY = my - (my - panY) * (newScale / zoomScale);
    zoomScale = newScale;
    dirty = true;
    draw();
  }, { passive: false });

  // Mouse down on canvas
  wrap.addEventListener("mousedown", function(e) {
    if (e.button !== 0) return;

    const canvasRect = canvasEl.getBoundingClientRect();
    const wx = (e.clientX - canvasRect.left - panX) / zoomScale;
    const wy = (e.clientY - canvasRect.top - panY) / zoomScale;
    const hitPath = hitTest(wx, wy);

    if (hitPath) {
      // Double-click: native dblclick OR synthetic (detail >= 2)
      if (e.detail >= 2 || (pendingClick && pendingClick.path === hitPath)) {
        if (pendingClick) { clearTimeout(pendingClick.timer); pendingClick = null; }
        onNodeDblClick(hitPath);
        return;
      }
      if (pendingClick) clearTimeout(pendingClick.timer);
      pendingClick = {
        path: hitPath,
        timer: setTimeout(function() {
          onNodeClick(pendingClick.path);
          pendingClick = null;
        }, 300)
      };
      return;
    }

    // Start pan drag
    isDragging = true;
    dragMoved = false;
    wrap.classList.add("panning");
    document.body.classList.add("dragging");
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    dragPanX = panX;
    dragPanY = panY;
    window.getSelection().removeAllRanges();
  });

  // Native dblclick handler (for test compatibility and real double-clicks)
  wrap.addEventListener("dblclick", function(e) {
    const canvasRect = canvasEl.getBoundingClientRect();
    const wx = (e.clientX - canvasRect.left - panX) / zoomScale;
    const wy = (e.clientY - canvasRect.top - panY) / zoomScale;
    const hitPath = hitTest(wx, wy);
    if (hitPath) {
      if (pendingClick) { clearTimeout(pendingClick.timer); pendingClick = null; }
      onNodeDblClick(hitPath);
    }
  });

  // Mouse move for pan (on window for smooth tracking)
  window.addEventListener("mousemove", function(e) {
    if (!isDragging) return;
    const dx = e.clientX - dragStartX;
    const dy = e.clientY - dragStartY;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) dragMoved = true;
    panX = dragPanX + dx;
    panY = dragPanY + dy;
    dirty = true;
    draw();
  });

  // Mouse up
  window.addEventListener("mouseup", function() {
    const wasDragging = isDragging;
    isDragging = false;
    document.getElementById("canvas-wrap").classList.remove("panning");
    document.body.classList.remove("dragging");
    if (wasDragging && !dragMoved) {
      // Click on empty canvas: deselect
      selectedPath = null;
      dirty = true;
      draw();
      renderSidebar();
    }
  });
}

// ============================================================================
// Canvas resize
// ============================================================================
function resizeCanvas() {
  const wrap = document.getElementById("canvas-wrap");
  if (!canvas || !wrap) return;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (w <= 0 || h <= 0) return;
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    dirty = true;
    draw();
  }
}

// ============================================================================
// Keyboard navigation (arrows only — no collapse toggle)
// ============================================================================
function setupKeyboard() {
  document.addEventListener("keydown", function(e) {
    if (!selectedPath) return;
    if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA") return;

    const node = nodeMap.get(selectedPath);
    if (!node) return;
    let newSel = null;

    switch (e.key) {
      case "ArrowLeft":
        e.preventDefault();
        if (node.parent) newSel = node.parent;
        break;
      case "ArrowRight":
        e.preventDefault();
        // Move to first visible child
        if (!collapsed.has(selectedPath)) {
          const kids = childrenMap.get(selectedPath) || [];
          if (kids.length > 0) newSel = kids[0];
        }
        break;
      case "ArrowUp":
        e.preventDefault();
        newSel = prevSibling(selectedPath);
        break;
      case "ArrowDown":
        e.preventDefault();
        newSel = nextSibling(selectedPath);
        break;
    }

    if (newSel && newSel !== selectedPath) {
      selectedPath = newSel;
      dirty = true;
      draw();
      renderSidebar();
    }
  });
}

function prevSibling(path) {
  const node = nodeMap.get(path);
  if (!node || !node.parent) return null;
  const sibs = childrenMap.get(node.parent) || [];
  const idx = sibs.indexOf(path);
  if (idx > 0) return sibs[idx - 1];
  return null;
}

function nextSibling(path) {
  const node = nodeMap.get(path);
  if (!node || !node.parent) return null;
  const sibs = childrenMap.get(node.parent) || [];
  const idx = sibs.indexOf(path);
  if (idx >= 0 && idx < sibs.length - 1) return sibs[idx + 1];
  return null;
}

// ============================================================================
// Zoom to fit
// ============================================================================
function zoomToFit() {
  const wrap = document.getElementById("canvas-wrap");
  if (!wrap) return;
  const cw = wrap.clientWidth, ch = wrap.clientHeight;
  if (cw <= 0 || ch <= 0) return;

  computeVisibleLayout();

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const [path, pos] of positions) {
    const node = nodeMap.get(path);
    if (!node) continue;
    const cx = svgX(pos.x), cy = svgY(pos.y);
    const ri = rankIdx(node.rank);
    const r = RANK_NODE_R[ri] || 3;
    if (isNaN(cx) || isNaN(cy)) continue;
    minX = Math.min(minX, cx - r);
    minY = Math.min(minY, cy - r);
    maxX = Math.max(maxX, cx + r);
    maxY = Math.max(maxY, cy + r);
  }
  if (!isFinite(minX)) return;

  const bw = maxX - minX || 1, bh = maxY - minY || 1;
  const pad = 40;
  const sx = (cw - pad * 2) / bw;
  const sy = (ch - pad * 2) / bh;
  zoomScale = Math.min(sx, sy, 2.0);
  panX = (cw - bw * zoomScale) / 2 - minX * zoomScale;
  panY = (ch - bh * zoomScale) / 2 - minY * zoomScale;
  dirty = true;
  draw();
}

// ============================================================================
// Rank-based collapse/expand — collapse AT given rank
// ============================================================================
function collapseAtRank(rankName) {
  collapsed.clear();
  const targetIdx = RANKS.indexOf(rankName);
  for (const path of nodeMap.keys()) {
    const node = nodeMap.get(path);
    const ri = rankIdx(node.rank);
    const kids = childrenMap.get(path) || [];
    if (ri === targetIdx && kids.length > 0) {
      collapsed.add(path);
    }
  }
}

// ============================================================================
// File loading (UI)
// ============================================================================
function setupFilePicker() {
  const picker = document.getElementById("file-picker");
  const dropZone = document.getElementById("drop-zone");
  const fileInput = document.getElementById("file-input");

  dropZone.addEventListener("click", function() { fileInput.click(); });

  fileInput.addEventListener("change", function() {
    const file = fileInput.files[0];
    if (file) loadFromFile(file);
  });

  dropZone.addEventListener("dragover", function(e) {
    e.preventDefault();
    dropZone.classList.add("drag-over");
  });

  dropZone.addEventListener("dragleave", function() {
    dropZone.classList.remove("drag-over");
  });

  dropZone.addEventListener("drop", function(e) {
    e.preventDefault();
    dropZone.classList.remove("drag-over");
    const file = e.dataTransfer.files[0];
    if (file) loadFromFile(file);
  });

  // Also allow whole-page drop
  document.addEventListener("dragover", function(e) { e.preventDefault(); });
  document.addEventListener("drop", function(e) {
    e.preventDefault();
    const file = e.dataTransfer.files[0];
    if (file && file.name.endsWith(".json")) loadFromFile(file);
  });
}

function loadFromFile(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.meta || !data.nodes) {
        alert("Invalid tree file: missing meta or nodes");
        return;
      }
      loadTree(data);
      hideFilePicker();
    } catch (err) {
      alert("Failed to parse JSON: " + err.message);
    }
  };
  reader.readAsText(file);
}

function hideFilePicker() {
  document.getElementById("file-picker").classList.remove("show");
}

// ============================================================================
// Full load pipeline
// ============================================================================
function loadTree(data) {
  buildTree(data);

  // Header
  const meta = data.meta || {};
  document.getElementById("header-seed").textContent = "Seed " + (meta.seed !== undefined ? meta.seed : "?");
  const c = meta.counts || {};
  document.getElementById("header-counts").textContent =
    RANKS.map(r => r[0].toUpperCase() + ":" + (c[r] || 0)).join("  ");

  // Hide the file-picker overlay
  hideFilePicker();

  // Default: collapse everything below order (collapsed at order level)
  collapseAtRank("order");
  selectedPath = null;

  dirty = true;
  draw();
  renderSidebar();
  zoomToFit();
}

// ============================================================================
// Programmatic API
// ============================================================================
window.loadTree = function(jsonObject) {
  if (!jsonObject || !jsonObject.meta || !jsonObject.nodes) {
    console.error("loadTree: invalid tree object");
    return;
  }
  loadTree(jsonObject);
};

window.getVisibleNodeCount = function() {
  return visibleNodes().size;
};

window.getSelectedPath = function() {
  return selectedPath;
};

window.__drawDirect = function() {
  draw();
};

window.__selectPath = function(path) {
  onNodeClick(path);
};

window.__nodeScreenPos = function(path) {
  const region = hitRegions.get(path);
  if (!region) return null;
  const canvasRect = canvas.getBoundingClientRect();
  const sx = region.cx * zoomScale + panX + canvasRect.left;
  const sy = region.cy * zoomScale + panY + canvasRect.top;
  return { x: sx, y: sy };
};

// ============================================================================
// Init
// ============================================================================
function init() {
  canvas = document.getElementById("tree-canvas");
  ctx = canvas.getContext("2d");

  setupFilePicker();
  setupKeyboard();
  setupZoomPan();

  // Resize observer
  const wrap = document.getElementById("canvas-wrap");
  if (window.ResizeObserver) {
    new ResizeObserver(function() { resizeCanvas(); }).observe(wrap);
  } else {
    window.addEventListener("resize", resizeCanvas);
  }

  // Reset button
  document.getElementById("btn-reset").addEventListener("click", function() {
    collapsed.clear();
    collapseAtRank("order");
    selectedPath = null;
    zoomScale = 1; panX = 0; panY = 0;
    dirty = true;
    draw();
    renderSidebar();
    zoomToFit();
  });

  // Fit button
  document.getElementById("btn-fit").addEventListener("click", zoomToFit);

  // Show file picker
  document.getElementById("file-picker").classList.add("show");
}

document.addEventListener("DOMContentLoaded", init);

})();
</script>
</body>
</html>
