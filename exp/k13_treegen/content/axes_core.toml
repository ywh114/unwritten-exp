# M2 — core cross-plan axes (non-morphometric blocks).
# These are the blocks v1 lacked: niche, diet, life_history, behavior,
# ecosystem, sex_age_season — plus the single shared mass axis (B1 size
# convention: exactly one unit=mass axis registry-wide). Morphometric knobs
# live in axes_morphometrics.toml (converted from B1 by the content fill).
# Authored per exp/k13_treegen/docs/m2-content-pack.md design tables.

# ──  the single mass axis (morphometrics block, but shared cross-plan)  ──
[axis.body_mass]
block = "morphometrics"
tier = "steady"
value_type = "scalar"
mutation = "log_gaussian"
sigma = 0.3
bounds = [0.0001, 100000.0]        # kg: 0.1 g shrew to 100 t whale-grade
unit = "mass"                       # the ONE mass axis (lint)
plan_scope = "all"
consumers = ["stress", "pop", "name"]
salience = 0.9
grammar_role = "size"

# ──  niche  ──────────────────────────────────────────────────────────────
[axis.temp_opt_c]
block = "niche"
tier = "steady"
value_type = "scalar"
mutation = "gaussian"
sigma = 2.0
bounds = [-30.0, 45.0]
plan_scope = "all"
consumers = ["stress", "tell"]
salience = 0.3

[axis.temp_breadth_c]
block = "niche"
tier = "steady"
value_type = "scalar"
mutation = "gaussian"
sigma = 1.0
bounds = [0.5, 25.0]
plan_scope = "all"
consumers = ["stress"]
salience = 0.2

[axis.moisture_opt]
block = "niche"
tier = "steady"
value_type = "scalar"
mutation = "ratio"
sigma = 0.08
bounds = [0.0, 1.0]
plan_scope = "all"
consumers = ["stress", "tell"]
salience = 0.2

[axis.moisture_breadth]
block = "niche"
tier = "steady"
value_type = "scalar"
mutation = "ratio"
sigma = 0.06
bounds = [0.0, 1.0]
plan_scope = "all"
consumers = ["stress"]
salience = 0.1

# ──  diet / trophic  ─────────────────────────────────────────────────────
# Diet is a WEIGHTED SPECTRUM over guilds, not a single label (omnivory is the
# default; the "omnivore" enum state was the tell). A bear is grazer +
# frugivore + piscivore + carnivore. Weights sum ~1, dominated by 1-2 guilds
# for specialists. See docs/spec-notes/2026-07-27-k13-rounds-fragmentation.md.
[axis.diet_spectrum]
block = "diet"
tier = "steady"
value_type = "weighted_set"
mutation = "weight_redraw"
sigma = 0.1
states = ["grazer", "browser", "folivore", "frugivore", "granivore",
          "nectarivore", "fungivore", "insectivore", "piscivore",
          "molluscivore", "carnivore", "scavenger", "filter_feeder",
          "detritivore", "omnivore", "planktivore"]
plan_scope = "all"
consumers = ["stress", "pop", "tell", "name"]
salience = 0.85
grammar_role = "diet"

[axis.trophic_level]
block = "diet"
tier = "steady"
value_type = "scalar"
mutation = "gaussian"
sigma = 0.2
bounds = [1.0, 5.0]
plan_scope = "all"
consumers = ["pop"]
salience = 0.3

[axis.niche_breadth]
block = "diet"
tier = "steady"
value_type = "scalar"
mutation = "ratio"
sigma = 0.08
bounds = [0.0, 1.0]
plan_scope = "all"
consumers = ["stress", "pop"]
salience = 0.2

