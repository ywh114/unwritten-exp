# ── §2.3 Decision table ──

[suffix_policy.behavior]
primary = "none (standalone adj.)"
fallback = ""
notes = "nocturnus, migratorius, natator, cursorius."

[suffix_policy.color_approximate]
primary = "-oides"
fallback = "standalone adj."
notes = "\"Glaucous-like\" is glaucoides if the color is approximate."

[suffix_policy.color_pure_hue]
primary = "none (standalone adj.)"
fallback = ""
notes = "rufus, flavus, viridis are already complete words."

[suffix_policy.diet]
primary = "none (standalone adj.)"
fallback = ""
notes = "piscivorus, carnivorus, insectivorus."

[suffix_policy.geography]
primary = "-ensis variant (e.g., -alis)"
fallback = ""
notes = "borealis, australis, orientalis. These are already fossilized forms."

[suffix_policy.habitat_place]
primary = "-ensis / -is form"
fallback = "-cola"
notes = "-ensis for geographic origin; -cola for substrate inhabitation. The fallback handles edge cases like \"mud-dweller\" where both make sense — prefer -cola for microhabitat."

[suffix_policy.habitat_substrate]
primary = "-cola"
fallback = "-ensis"
notes = "Sand, rock, cave, mud, tree — the organism lives *in* it, not *from* it."

[suffix_policy.honor_person]
primary = "-i / -ae"
fallback = "avoid"
notes = "Engine should not generate eponyms. Human-authored only."

[suffix_policy.morphology_part_shape]
primary = "compound (prefix + body-part root)"
fallback = "-oides"
notes = "latirostris, curvicauda. If no part root fits, -oides (\"that-shaped\")."

[suffix_policy.size_relative_to_part]
primary = "compound (prefix + body-part root)"
fallback = "standalone"
notes = "longicauda, brevipes, macrocephala."

[suffix_policy.size_standalone]
primary = "none (standalone adj.)"
fallback = ""
notes = "gracilis, robustus, giganteus."

[suffix_policy.texture_covering]
primary = "none (standalone adj.)"
fallback = ""
notes = "hirsutus, glaber, spinosus, squamosus."

