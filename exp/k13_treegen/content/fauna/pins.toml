# ──  M4: radiation anchors with directional drift  ────────────────────────
# equines — horse-grade genus anchor, "horse but more cursorial": the
# directional-drift demonstrator (biases in sigma units, see docs/m4-pins.md)
[[pin]]
preset = "tetrapod.deer"
label = "equines"
name = { binomial = "Equus" }
rank = "genus"
radiation = 3
drift = { limb_length_to_trunk = 1.0, neck_length_ratio = 0.5 }
axes = { body_mass = 300.0, diet_spectrum = { grazer = 1.0 }, social_system = "herd", group_size = 12.0 }
flags = ["pinned"]

