# pins.toml — Tier-1 anchors (taste-informed; me-authored pin→preset map).
# Pins are real animals used as-is (taste bootstrap: everyday register =
# standard archetypes, no invented everyday creatures). Species-rank pins sit
# under the nearest preset + overrides. Texture pins are any-rank radiation
# controls (radiation = authored param, not dynamics).
# Axis overrides use the M1 registry axis names (body_mass, diet_guild, ...).

# ──  carry / ride  ───────────────────────────────────────────────────────
[[pin]]
preset = "tetrapod.deer"
parent_pin = "equines"
label = "horse"
name = { binomial = "Equus caballus", folk = "horse" }
knobs = { toe_count = 1, metapodial_proximal_ratio = 0.9, tail_length_ratio = 0.5 }
axes = { body_mass = 450.0, diet_spectrum = { grazer = 1.0 }, social_system = "herd", activity_period = "diurnal" }
flags = ["pinned"]

