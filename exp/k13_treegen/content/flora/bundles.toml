# bundles.toml — K14 flora bundle records (region x physiology archetypes).
#
# A bundle is a superset-generalist envelope standing in for MANY similar
# real species. It is CONTENT — NOT a tree node, NOT a seeded lineage:
#   - envelope: the trait profile (defining traits + the sim's stress-
#     interface tolerance axes). Same axes the species pins use. Carried
#     VERBATIM from the removed bundle-track pins (commit 3dbae1c).
#   - plan / layer: body plan (preset prefix before the dot) and the
#     layer axis value, from the removed bundle's preset + axes.layer.
#   - covered_region: region x physiology window note (a coverage-audit
#     note; the ENGINE reads neither).
#   - anchor_families / anchor_genera: the POLYPHYLETIC clade set the
#     bundle's members fall under — what the 0027 daughter-placement
#     step drops generated species into (researched sets,
#     tmp/bundle-anchor-sets.md).
#
# Curation notes (from the anchor-set research):
#   - mangrove-palms (Nypa) was effectively monogeneric and is MERGED
#     into mangrove-associates (Nypa + Arecaceae added below); no
#     separate mangrove-palms bundle exists.
#   - alpine-meadow-flowers excludes Espeletia (páramo-specific; the
#     researched genera list carries no páramo analog).

