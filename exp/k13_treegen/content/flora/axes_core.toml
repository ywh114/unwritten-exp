# K14 flora — core trait axes (M1 registry format, mirrored from K13).
# block ∈ morphometrics | patternation | niche | diet | life_history |
# behavior | ecosystem | sex_age_season. tier: invariant | steady |
# labile. mutation: gaussian | log_gaussian | enum_redraw | ratio.

# ── architecture (morphometrics) ──────────────────────────────────────
[axis.height_m]
block = "morphometrics"
tier = "steady"
value_type = "scalar"
mutation = "log_gaussian"
sigma = 0.5
bounds = [0.005, 200.0]            # duckweed .. god-tree-adjacent
unit = "length"
plan_scope = "all"
consumers = ["stress", "id", "name", "pop", "draw"]
salience = 0.7

[axis.woodiness]
block = "morphometrics"
tier = "steady"
value_type = "scalar"
mutation = "ratio"
sigma = 0.1
bounds = [0.0, 1.0]
plan_scope = "all"
consumers = ["stress", "id"]
salience = 0.3

[axis.wood_density]
block = "morphometrics"
tier = "steady"
value_type = "scalar"
mutation = "log_gaussian"
sigma = 0.2
bounds = [0.1, 1.5]                # g/cm3: balsa .. lignum vitae
plan_scope = ["tree", "shrub", "succulent"]
consumers = ["stress", "pop"]
salience = 0.1

[axis.growth_rate]
block = "life_history"
tier = "steady"
value_type = "scalar"
mutation = "log_gaussian"
sigma = 0.4
bounds = [0.005, 5.0]              # m/yr
plan_scope = "all"
consumers = ["stress", "pop"]
salience = 0.2

[axis.longevity_yr]
block = "life_history"
tier = "steady"
value_type = "scalar"
mutation = "log_gaussian"
sigma = 0.5
bounds = [0.05, 10000.0]           # ephemeral .. bristlecone tail
plan_scope = "all"
consumers = ["pop", "tell"]
salience = 0.2

[axis.shade_tolerance]
block = "niche"
tier = "steady"
value_type = "scalar"
mutation = "ratio"
sigma = 0.1
bounds = [0.0, 1.0]                # one axis (vocab §9 ruling)
plan_scope = "all"
consumers = ["stress", "id"]
salience = 0.3

[axis.pioneer_climax]
block = "life_history"
tier = "steady"
value_type = "scalar"
mutation = "ratio"
sigma = 0.1
bounds = [0.0, 1.0]                # 0 ruderal .. 1 climax (CSR position)
