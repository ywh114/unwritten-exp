# K14 flora — flower-color palettes per plan. Seed plans: full gamut
# (syndrome-color correlation is a CONSTRAINT, not a palette cut —
# wind-pollinated lineages stay dull via the constraint rules, not by
# making red illegal). Spore/decomposer plans: spore-mass colors only.
# Lint checks preset/pin flower_color against these.

[palette.tree]
colors = ["white", "cream", "yellow", "orange", "red", "pink", "purple",
          "blue", "green", "brown", "black"]

