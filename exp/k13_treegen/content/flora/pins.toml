# pins.toml — K14 flora census (0012: individual-track pins; <200 seeded
# lineages). Bundle-track and the stub scaffold land in the 0012 rework
# (bundle = sim-side envelope + anchor clades, NOT tree pins — rulings
# 9-14); the misinterpreted bundle pins were removed 2026-08-02.
#
# INDIVIDUAL TRACK (see CENSUS.md):
#   habitat-defining physics (canopy/sward/holdfast/mat via layer +
#   engineer_impact, high expected cover). Genus-rank pins radiate 1-2
#   species; species-rank pins are single lineages.
#
# Pin records commit byte-exact at their rank (backbone rule); scalar
# axes get a small seeded jitter, enums stay exact. flower_color is
# DERIVED (B5 §5.2) — tune via pigment_pathway / pigment_expression /
# ph_tolerance, never by authoring the bucket directly.

# ══════════════════════════════════════════════════════════════════════
# INDIVIDUAL TRACK
# ══════════════════════════════════════════════════════════════════════

