# pins.toml — K14 flora census (0012 Task A: two-track, <200 lineages).
#
# TWO TRACKS (see CENSUS.md):
#   individual-track — habitat-defining physics (canopy/sward/holdfast/
#     mat via layer + engineer_impact, high expected cover). Genus-rank
#     pins radiate 1-2 species; species-rank pins are single lineages.
#     No bundle flag.
#   bundle-track — archetype superset generalists cut by REGION x
#     PHYSIOLOGY. One (plan, layer), WIDER tolerance breadths, CENTRAL
#     optima, archetypal enums, generous propagule_count (guild seed
#     rain). Marked `bundle = true` (content-level flag; content.py
#     exposes it via is_bundle()). `covered_region` records the biome-
#     region x substrate window the envelope covers (a note for the
#     coverage audit; the ENGINE reads neither).
#
# Pin records commit byte-exact at their rank (backbone rule); scalar
# axes get a small seeded jitter, enums stay exact. flower_color is
# DERIVED (B5 §5.2) — tune via pigment_pathway / pigment_expression /
# ph_tolerance, never by authoring the bucket directly.

# ══════════════════════════════════════════════════════════════════════
# INDIVIDUAL TRACK
# ══════════════════════════════════════════════════════════════════════

# ──  Fagales order (tree.oak) — temperate/boreal broadleaf  ───────────
