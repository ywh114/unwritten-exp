# ══════════════════════════════════════════════════════════════════════
# BUNDLE TRACK — archetype superset generalists (region x physiology)
# ══════════════════════════════════════════════════════════════════════
# Construction per bundle: ONE (plan, layer); wider tolerance breadths;
# central optima in the biome core; archetypal enums (never averaged);
# generous propagule_count (guild seed rain). Viability envelope must
# CONTAIN the design-space region its future (0027) daughter species
# will occupy. Co-window bundles are clade-spread (see CENSUS.md).

# ── temperate ──────────────────────────────────────────────────────────
