# ──  grade genus suffixes (same shape as K13 stems.toml genus_suffix;
# genders parallel to suffixes, matching the K13 SUFFIX_GENDER ruling) ──
[genus_suffix.tree]
grade = "Tree-grade"
suffixes = ["-dendron", "-aris", "-acia"]
genders = ["n", "f", "f"]
example_roots = ["Quercodendron", "Pinaris"]
precedent = "Rhododendron, Liriodendron, Acacia"

[genus_suffix.herb]
grade = "Herb-grade"
suffixes = ["-ella", "-ia", "-opsis", "-wortia"]
genders = ["f", "f", "f", "f"]
example_roots = ["Albella", "Caerulopsis"]
precedent = "Potentilla, Dahlia, Coreopsis, -wort compounds"

[genus_suffix.grass]
grade = "Grass-grade"
suffixes = ["-aria", "-ochloa", "-poa"]
genders = ["f", "f", "f"]
example_roots = ["Festucaria", "Xerochloa"]
precedent = "Avenaria, Poa, Dendrochloa"

[genus_suffix.water]
grade = "Water-grade"
suffixes = ["-hydra", "-nelia"]
genders = ["f", "f"]
example_roots = ["Nymphohydra", "Paludonelia"]
precedent = "Hydrolea, Neli(o)nelia water-plant coinages"

[genus_suffix.fungus]
grade = "Fungus-grade"
suffixes = ["-myces", "-omyces"]
genders = ["m", "m"]
example_roots = ["Lignomyces", "Humicomyces"]
precedent = "Agaricomyces, Streptomyces"

