# stems_flora.toml — K14 flora AUTHORED naming content (mirrors K13
# stems_authored.toml format): engine axis -> epithet stem pools,
# free-invention pools, context-gated stems (NameContext hook),
# grade genus suffixes.
#
# pattern: us = base+us/a/um | is = base+is/is/e | invariant = as written.
# source: attested (real binomial) | invented (fantasy gap-fill;
# attested-majority, invented gaps, double coverage OK).

