# Flora stub scaffold — AUTHORED stubs (0012 ruling 11/12/14).
#
# A stub is an EMPTY (unseeded) taxonomic node that 0027 constructs
# daughters into / pulls from post-sim. Stubs seed NOTHING (the <200
# seeded-lineage budget is untouched). Authored stubs are named real
# taxa; the RADIATED bulk (the report §6 singleton tail, ~200-275
# genera) is a separate machinery increment.
#
# Stubs are keyed by PLAN: the builder creates one empty node per stub
# record under each order of that plan (current content has one order
# per stub-bearing plan). radiate = "post" by default (a stub is a
# growth source; the demand function / 0027 fills it after the sim).
#
# The first set: the reef's very diverse coral + sponge stub genera
# (research agent-15 — real genera, families in the anchor sets of the
# reef-stony-corals / reef-soft-corals / reef-sponges bundles).

