# M2 — morphometric axes for the 3 starting plans (tetrapod, winged_biped, hexapod).
# Converted mechanically from B1 v0.3 §§2-5 + §13 surface dials per the
# m2-content-pack.md design tables. Tier / mutation / sigma / salience /
# grammar_role assignment is mechanical — no judgment.
#
# Unit: dimensionless for ALL of these (body_mass is in axes_core.toml).
# Naming: tetrapod axes are bare (matching pins.toml); winged_biped/hexapod
#   axes that collide with tetrapod names are prefixed (winged_, insect_).

