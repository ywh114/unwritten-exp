<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K11 World Viewer</title>
<link rel="icon" href="data:,">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #1a1a2e; color: #e0e0e0;
  height: 100vh; display: flex; overflow: hidden;
}

/* ── File Picker Overlay ── */
#file-picker {
  display: flex; position: fixed; inset: 0; background: rgba(10,10,30,0.85); z-index: 2000;
  align-items: center; justify-content: center;
}
#file-picker.hidden { display: none; }
#file-picker .drop-zone {
  background: #16213e; border: 3px dashed #0f3460; border-radius: 12px;
  padding: 50px 70px; text-align: center; cursor: pointer; transition: border-color 0.2s;
}
#file-picker .drop-zone.drag-over { border-color: #2980b9; background: #1a2a4a; }
#file-picker .drop-zone h2 { font-weight: 500; margin-bottom: 8px; font-size: 20px; }
#file-picker .drop-zone p { color: #667788; font-size: 13px; }
#file-picker .drop-zone input[type=file] { display: none; }

#loading-indicator {
  display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  background: #16213e; border: 1px solid #2980b9; border-radius: 8px;
  padding: 16px 28px; z-index: 3000; font-size: 15px; color: #5dade2;
}

/* ── Side Panel ── */
#panel {
  width: 345px; min-width: 345px; background: #16213e; border-right: 1px solid #0f3460;
  display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; z-index: 10;
}
#panel::-webkit-scrollbar { width: 6px; }
#panel::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }

.panel-section {
  padding: 10px 14px; border-bottom: 1px solid #0f3460;
}
.panel-section h2 {
  font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; color: #8899aa; margin-bottom: 7px;
}

/* ── Layer Buttons ── */
#layer-buttons { display: flex; flex-wrap: wrap; gap: 4px; }
#layer-buttons button {
  padding: 4px 9px; border: 1px solid #0f3460; background: #1a1a2e;
  color: #c0c0c0; border-radius: 3px; cursor: pointer; font-size: 11px;
  transition: all 0.15s;
}
#layer-buttons button:hover { border-color: #1a5276; background: #0f3460; }
#layer-buttons button.active { background: #1a5276; border-color: #2980b9; color: #fff; }

/* ── Collapsible ── */
.collapse-header {
  cursor: pointer; user-select: none; display: flex; align-items: center; gap: 6px;
  font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; color: #8899aa; margin-bottom: 5px;
}
.collapse-header .arrow { display: inline-block; transition: transform 0.2s; font-size: 10px; }
.collapse-header.collapsed .arrow { transform: rotate(-90deg); }
.collapse-body { overflow: hidden; max-height: 500px; transition: max-height 0.3s ease; }
.collapse-body.hidden { max-height: 0; }

.stat-row { display: flex; justify-content: space-between; font-size: 12px; padding: 2px 0; border-bottom: 1px solid #0a1628; }
.stat-key { color: #8899aa; }
.stat-val { color: #e0e0e0; font-variant-numeric: tabular-nums; }
.stat-sub { padding-left: 12px; font-size: 11px; }
.stat-sub .stat-key { color: #667788; }

/* ── Search ── */
#search-input {
  width: 100%; padding: 6px 8px; background: #0f3460; color: #e0e0e0;
  border: 1px solid #1a5276; border-radius: 4px; font-size: 13px;
  font-family: monospace; margin-bottom: 4px;
}
#search-input:focus { outline: none; border-color: #2980b9; }

#search-btn-row { display: flex; gap: 4px; margin-bottom: 6px; }
#search-btn-row button {
  padding: 4px 12px; border: none; border-radius: 3px; cursor: pointer; font-size: 12px;
}
#search-submit { background: #1a5276; color: #fff; }
#search-submit:hover { background: #2980b9; }
#search-clear { background: #3a1a1a; color: #e06060; }
#search-clear:hover { background: #5a2a2a; }

.examples { font-size: 11px; color: #667788; margin-bottom: 6px; }
.examples span { color: #1a8; cursor: pointer; text-decoration: underline; }
.examples span:hover { color: #2cb; }
.examples span + span { margin-left: 8px; }

#search-results { font-size: 12px; }
#search-results .sr-summary { color: #c0c0c0; margin-bottom: 4px; }
#search-error { color: #e06060; font-size: 12px; }

/* ── Area Stats ── */
#area-stats .sr-summary { color: #c0c0c0; margin-bottom: 4px; font-size: 12px; }

.biome-bar { display: flex; align-items: center; gap: 6px; font-size: 11px; margin: 1px 0; }
.biome-bar .bb-fill { height: 10px; background: #1a5276; border-radius: 2px; min-width: 2px; }
.biome-bar .bb-label { color: #8899aa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.biome-bar .bb-pct { color: #667788; font-variant-numeric: tabular-nums; }

/* ── Map Canvas ── */
#map-wrap { flex: 1; position: relative; cursor: crosshair; }
#map-wrap.grabbing { cursor: grabbing; }
#map-canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }

/* ── Tooltip ── */
#tooltip {
  position: fixed; z-index: 9999; pointer-events: none;
  background: rgba(15,20,40,0.96); border: 1px solid #2980b9;
  border-radius: 5px; padding: 8px 12px; font-size: 12px; line-height: 1.5;
  max-width: 260px; box-shadow: 0 4px 16px rgba(0,0,0,0.5); display: none;
}
#tooltip .tt-biome { color: #5dade2; font-weight: 600; margin-bottom: 3px; }
#tooltip .tt-pos { color: #667788; font-size: 11px; margin-bottom: 5px; }
#tooltip .tt-field { display: flex; justify-content: space-between; gap: 12px; }
#tooltip .tt-name { color: #8899aa; }
#tooltip .tt-val { color: #e0e0e0; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ── Selection Box ── */
#sel-box {
  position: absolute; border: 1px dashed #5dade2; background: rgba(41,128,185,0.12);
  pointer-events: none; display: none; z-index: 5;
}

/* ── Messages ── */
#error-toast {
  position: fixed; top: 12px; right: 24px; background: #5a2a2a; color: #e06060;
  padding: 8px 14px; border-radius: 4px; font-size: 12px; z-index: 100; display: none; max-width: 400px;
}
</style>
</head>
<body>

<!-- File Picker -->
<div id="file-picker">
  <div class="drop-zone" id="drop-zone">
    <h2>Open .k11view Bundle</h2>
    <p>Drop a file here or click to browse</p>
    <input type="file" id="file-input" accept=".k11view">
  </div>
</div>

<div id="loading-indicator">Loading…</div>

<!-- Side Panel -->
<div id="panel">
  <div class="panel-section">
    <h2>Layer</h2>
    <div id="layer-buttons"></div>
  </div>

  <div class="panel-section">
    <div class="collapse-header" id="stats-header">
      <span class="arrow">▼</span> World Stats
    </div>
    <div class="collapse-body" id="stats-body"></div>
  </div>

  <div class="panel-section">
    <h2>Search</h2>
    <input type="text" id="search-input" placeholder='e.g. elev_m > 2000 & biome == "boreal taiga"' spellcheck="false">
    <div id="search-btn-row">
      <button id="search-submit">Search</button>
      <button id="search-clear">Clear</button>
    </div>
    <div class="examples">
      Examples:
      <span data-expr='biome == "ocean"'>ocean</span>
      <span data-expr='elev_m > 2000 & biome == "boreal taiga"'>taiga&gt;2km</span>
      <span data-expr='river == 1 & biome_sim < 0.3'>rivers</span>
      <span data-expr='T_c < -15 & P_mm < 100'>cold+dry</span>
    </div>
    <div id="search-error"></div>
    <div id="search-results"></div>
  </div>

  <div class="panel-section" id="area-section">
    <h2>Area</h2>
    <div id="area-stats">
      <span style="color:#667788;font-size:12px;">Shift+drag on the map to select an area.</span>
    </div>
  </div>
</div>

<!-- Map -->
<div id="map-wrap">
  <canvas id="map-canvas"></canvas>
  <div id="sel-box"></div>
</div>

<!-- Tooltip -->
<div id="tooltip"></div>

<!-- Error toast -->
<div id="error-toast"></div>

<script>
"use strict";

// ══════════════════════════════════════════════════════════════════════
// DOM refs
// ══════════════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const filePicker = $("file-picker");
const dropZone = $("drop-zone");
const fileInput = $("file-input");
const loadingEl = $("loading-indicator");
const canvas = $("map-canvas");
const ctx = canvas.getContext("2d");
const mapWrap = $("map-wrap");
const tooltip = $("tooltip");
const selBox = $("sel-box");
const errorToast = $("error-toast");
const layerBtns = $("layer-buttons");
const statsHeader = $("stats-header");
const statsBody = $("stats-body");
const searchInput = $("search-input");
const searchRes = $("search-results");
const searchErr = $("search-error");
const areaStats = $("area-stats");

// ══════════════════════════════════════════════════════════════════════
// State
// ══════════════════════════════════════════════════════════════════════
const S = {
  header: null,        // parsed JSON header
  fields: {},          // name -> decoded TypedArray
  shape: [1024, 1024],
  biomeNames: {},      // id (string) -> name
  biomeNameById: {},   // numeric id -> name
  biomeColors: {},     // id (string) -> [r,g,b]
  layer: "world",
  layers: [],          // [{id, label}]

  // Pre-rendered layer canvases (1024×1024)
  layerCanvas: {},     // id -> offscreen Canvas

  // Backdrop Image
  backdropImg: null,

  // Pan / zoom
  ox: 0, oy: 0, scale: 1,

  // Interaction
  dragging: false,
  dragStartX: 0, dragStartY: 0, dragOX: 0, dragOY: 0,
  shifting: false, selActive: false,
  selX0: 0, selY0: 0, selX1: 0, selY1: 0,

  hoverTimer: null,
  searchMask: null,     // Uint8Array mask or null
  searchExpr: null,
};

// ══════════════════════════════════════════════════════════════════════
// Toast
// ══════════════════════════════════════════════════════════════════════
let toastTimer = null;
function toast(msg) {
  errorToast.textContent = msg;
  errorToast.style.display = "block";
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { errorToast.style.display = "none"; }, 4000);
}

// ══════════════════════════════════════════════════════════════════════
// Utilities
// ══════════════════════════════════════════════════════════════════════
function fmtNum(v) {
  if (typeof v === "number") {
    if (Number.isInteger(v)) return String(v);
    const s = v.toFixed(2);
    return s.replace(/\.?0+$/, "") || "0";
  }
  return String(v);
}

function fmtSI(v) {
  if (v == null) return "—";
  const n = Number(v);
  if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (Math.abs(n) >= 1e3) return (n / 1e3).toFixed(2) + "k";
  return n.toFixed(2);
}

function lerpColor(c1, c2, t) {
  const tt = Math.max(0, Math.min(1, t));
  return [
    Math.round(c1[0] + (c2[0] - c1[0]) * tt),
    Math.round(c1[1] + (c2[1] - c1[1]) * tt),
    Math.round(c1[2] + (c2[2] - c1[2]) * tt),
  ];
}

// ══════════════════════════════════════════════════════════════════════
// Bundle Parser
// ══════════════════════════════════════════════════════════════════════
function parseBundle(buf) {
  const dv = new DataView(buf);
  if (buf.byteLength < 8) throw new Error("Bundle too small");

  // Magic
  const magic = String.fromCharCode(dv.getUint8(0), dv.getUint8(1), dv.getUint8(2), dv.getUint8(3));
  if (magic !== "K11V") throw new Error(`Bad magic: ${magic}`);

  const hdrLen = dv.getUint32(4, true);
  if (8 + hdrLen > buf.byteLength) throw new Error("Header length exceeds buffer");

  const hdrBytes = new Uint8Array(buf, 8, hdrLen);
  const header = JSON.parse(new TextDecoder().decode(hdrBytes));
  if (header.format !== "k11view/1") throw new Error(`Unknown format: ${header.format}`);

  const shape = header.shape;
  const n = shape[0] * shape[1];

  // Parse fields
  let offset = 8 + hdrLen;
  const rawFields = {};
  for (const name of header.order) {
    const meta = header.fields[name];
    const dtype = meta.dtype;
    let arr;
    if (dtype === "u1") {
      arr = new Uint8Array(buf, offset, n);
      offset += n;
    } else if (dtype === "<u2") {
      arr = new Uint16Array(buf, offset, n);
      offset += n * 2;
    } else {
      throw new Error(`Unknown dtype: ${dtype}`);
    }
    rawFields[name] = { arr, meta };
  }

  return { header, rawFields, n };
}

// ══════════════════════════════════════════════════════════════════════
// Field Decoder
// ══════════════════════════════════════════════════════════════════════
function decodeFields(header, rawFields) {
  const n = header.shape[0] * header.shape[1];
  const decoded = {};

  for (const name of header.order) {
    const { arr, meta } = rawFields[name];
    if (name === "masks") {
      // Keep masks as-is, also extract individual mask arrays
      decoded.masks = arr;
      if (meta.bits) {
        for (let b = 0; b < meta.bits.length; b++) {
          const bitName = meta.bits[b];
          const bitArr = new Uint8Array(n);
          for (let i = 0; i < n; i++) bitArr[i] = (arr[i] >> b) & 1;
          decoded[bitName] = bitArr;
        }
      }
    } else if (meta.scale !== undefined || meta.offset !== undefined) {
      const scale = meta.scale ?? 1;
      const off = meta.offset ?? 0;
      if (arr instanceof Float32Array && scale === 1 && off === 0) {
        decoded[name] = arr;
      } else {
        const f32 = new Float32Array(n);
        for (let i = 0; i < n; i++) f32[i] = arr[i] * scale + off;
        decoded[name] = f32;
      }
    } else {
      // Categorical (biome, aquatic)
      decoded[name] = arr;
    }
  }

  return decoded;
}

// ══════════════════════════════════════════════════════════════════════
// Layer Pre-render
// ══════════════════════════════════════════════════════════════════════
// Layer definitions: each has a render function (data, n, W) or null for world.
const LAYERS = [
  { id: "world",       label: "World",        fn: null },
  { id: "biomes",      label: "Biomes",       fn: renderBiomes },
  { id: "elevation",   label: "Elevation",    fn: renderElevation },
  { id: "biome_sim",   label: "Biome Sim",    fn: renderBiomeSim },
  { id: "salinity",    label: "Salinity",     fn: renderSalinity },
  { id: "temperature", label: "Temperature",  fn: renderTemperature },
  { id: "precipitation", label: "Precip",     fn: renderPrecip },
  { id: "forest_cover",label: "Forest Cover", fn: renderForestCover },
];

// Lazy-render a layer on demand (cached).
function ensureLayer(id) {
  if (S.layerCanvas[id]) return S.layerCanvas[id];
  const layer = LAYERS.find(l => l.id === id);
  if (!layer || !layer.fn) return null;
  const [W, H] = S.shape;
  const off = document.createElement("canvas");
  off.width = W; off.height = H;
  const octx = off.getContext("2d");
  const imgData = octx.createImageData(W, H);
  layer.fn(imgData.data, W * H, W);
  octx.putImageData(imgData, 0, 0);
  S.layerCanvas[id] = off;
  return off;
}

function renderBiomes(data, n, W) {
  const biome = S.fields.biome;
  const colors = S.biomeColors;
  for (let i = 0; i < n; i++) {
    const c = colors[biome[i]] || [128, 128, 128];
    const j = i * 4;
    data[j] = c[0]; data[j + 1] = c[1]; data[j + 2] = c[2]; data[j + 3] = 255;
  }
}

function renderElevation(data, n, W) {
  const elev = S.fields.elev_m;
  let vmin = Infinity, vmax = -Infinity;
  for (let i = 0; i < n; i++) {
    if (elev[i] < vmin) vmin = elev[i];
    if (elev[i] > vmax) vmax = elev[i];
  }
  const range = vmax - vmin || 1;
  for (let i = 0; i < n; i++) {
    const v = Math.round(((elev[i] - vmin) / range) * 255);
    const j = i * 4;
    data[j] = v; data[j + 1] = v; data[j + 2] = v; data[j + 3] = 255;
  }
}

function renderBiomeSim(data, n, W) {
  const sim = S.fields.biome_sim;
  // 1 (confident) → white [255,255,255]; 0 (ecotone) → magenta [200,0,200]
  for (let i = 0; i < n; i++) {
    const t = sim[i];
    const j = i * 4;
    data[j]     = Math.round(200 + (255 - 200) * t);
    data[j + 1] = Math.round(0 + (255 - 0) * t);
    data[j + 2] = Math.round(200 + (255 - 200) * t);
    data[j + 3] = 255;
  }
}

function renderSalinity(data, n, W) {
  const sal = S.fields.salinity;
  // 0 → white [255,255,255]; 40 → dark blue [0,30,120]
  for (let i = 0; i < n; i++) {
    const t = Math.min(sal[i] / 40, 1);
    const j = i * 4;
    data[j]     = Math.round(255 + (0 - 255) * t);
    data[j + 1] = Math.round(255 + (30 - 255) * t);
    data[j + 2] = Math.round(255 + (120 - 255) * t);
    data[j + 3] = 255;
  }
}

function renderTemperature(data, n, W) {
  const T = S.fields.T_c;
  // -40 → blue [0,0,255]; 0 → white [255,255,255]; 40 → red [255,0,0]
  for (let i = 0; i < n; i++) {
    const t = T[i];
    let r, g, b;
    if (t <= 0) {
      const f = (t + 40) / 40;
      r = Math.round(0 + (255 - 0) * f);
      g = Math.round(0 + (255 - 0) * f);
      b = 255;
    } else {
      const f = t / 40;
      r = 255;
      g = Math.round(255 + (0 - 255) * f);
      b = Math.round(255 + (0 - 255) * f);
    }
    const j = i * 4;
    data[j] = r; data[j + 1] = g; data[j + 2] = b; data[j + 3] = 255;
  }
}

function renderPrecip(data, n, W) {
  const P = S.fields.P_mm;
  // 0 → white [255,255,255]; 600 → dark blue [0,50,200]
  for (let i = 0; i < n; i++) {
    const t = Math.min(P[i] / 600, 1);
    const j = i * 4;
    data[j]     = Math.round(255 + (0 - 255) * t);
    data[j + 1] = Math.round(255 + (50 - 255) * t);
    data[j + 2] = Math.round(255 + (200 - 255) * t);
    data[j + 3] = 255;
  }
}

function renderForestCover(data, n, W) {
  const cover = S.fields.cover;
  const GREEN = [34, 139, 34], GRAY = [128, 128, 128];
  for (let i = 0; i < n; i++) {
    const t = cover[i];
    const r = Math.round(GRAY[0] + (GREEN[0] - GRAY[0]) * t);
    const g = Math.round(GRAY[1] + (GREEN[1] - GRAY[1]) * t);
    const b = Math.round(GRAY[2] + (GREEN[2] - GRAY[2]) * t);
    const j = i * 4;
    data[j] = r; data[j + 1] = g; data[j + 2] = b; data[j + 3] = 255;
  }
}

// ══════════════════════════════════════════════════════════════════════
// Layer Buttons
// ══════════════════════════════════════════════════════════════════════
function buildLayerButtons() {
  layerBtns.innerHTML = "";
  for (const layer of S.layers) {
    const btn = document.createElement("button");
    btn.textContent = layer.label;
    btn.dataset.layer = layer.id;
    if (layer.id === S.layer) btn.classList.add("active");
    btn.onclick = () => switchLayer(layer.id);
    layerBtns.appendChild(btn);
  }
}

function switchLayer(id) {
  S.layer = id;
  buildLayerButtons();
  // Lazy-render if not the world layer
  if (id !== "world") ensureLayer(id);
  render();
}

// ══════════════════════════════════════════════════════════════════════
// World Stats
// ══════════════════════════════════════════════════════════════════════
function renderWorldStats(stats) {
  const lines = [];
  for (const [k, v] of Object.entries(stats)) {
    if (k === "complex" && typeof v === "object" && v !== null && !Array.isArray(v)) {
      lines.push(`<div class="stat-row"><span class="stat-key">complex</span><span class="stat-val">—</span></div>`);
      for (const [sk, sv] of Object.entries(v)) {
        if (sk === "audit_defects") {
          lines.push(`<div class="stat-row stat-sub"><span class="stat-key">${sk}</span><span class="stat-val">${Array.isArray(sv) ? sv.length : sv} defects</span></div>`);
        } else if (typeof sv === "number") {
          lines.push(`<div class="stat-row stat-sub"><span class="stat-key">${sk}</span><span class="stat-val">${fmtNum(sv)}</span></div>`);
        }
      }
    } else if (k === "biome_histogram" && typeof v === "object") {
      const total = Object.values(v).reduce((a, b) => a + b, 0);
      lines.push(`<div class="stat-row"><span class="stat-key">biome_histogram</span><span class="stat-val">${total} cells</span></div>`);
      for (const [bk, bv] of Object.entries(v).sort((a, b) => b[1] - a[1])) {
        const pct = ((bv / total) * 100).toFixed(1);
        lines.push(`<div class="stat-row stat-sub"><span class="stat-key">${bk}</span><span class="stat-val">${bv} (${pct}%)</span></div>`);
      }
    } else if (k === "climate_mode" && typeof v === "object") {
      lines.push(`<div class="stat-row"><span class="stat-key">climate_mode</span><span class="stat-val">${JSON.stringify(v)}</span></div>`);
    } else if (k === "climate_trivia" && typeof v === "object") {
      lines.push(`<div class="stat-row"><span class="stat-key">climate_trivia</span><span class="stat-val">—</span></div>`);
      for (const [ck, cv] of Object.entries(v)) {
        lines.push(`<div class="stat-row stat-sub"><span class="stat-key">${ck.replace(/_/g, " ")}</span><span class="stat-val">${fmtNum(cv)}</span></div>`);
      }
    } else if (k === "biome_coherence" && typeof v === "number") {
      lines.push(`<div class="stat-row"><span class="stat-key">biome coherence</span><span class="stat-val">${fmtNum(v)}</span></div>`);
    } else if (typeof v === "number") {
      lines.push(`<div class="stat-row"><span class="stat-key">${k.replace(/_/g, " ")}</span><span class="stat-val">${fmtSI(v)}</span></div>`);
    } else if (typeof v === "boolean") {
      lines.push(`<div class="stat-row"><span class="stat-key">${k.replace(/_/g, " ")}</span><span class="stat-val">${v}</span></div>`);
    } else if (v == null) {
      lines.push(`<div class="stat-row"><span class="stat-key">${k.replace(/_/g, " ")}</span><span class="stat-val">—</span></div>`);
    } else {
      lines.push(`<div class="stat-row"><span class="stat-key">${k.replace(/_/g, " ")}</span><span class="stat-val">${JSON.stringify(v)}</span></div>`);
    }
  }
  statsBody.innerHTML = lines.join("");

  let collapsed = false;
  statsHeader.onclick = () => {
    collapsed = !collapsed;
    statsHeader.classList.toggle("collapsed", collapsed);
    statsBody.classList.toggle("hidden", collapsed);
  };
}

// ══════════════════════════════════════════════════════════════════════
// Canvas Rendering
// ══════════════════════════════════════════════════════════════════════
function render() {
  const cw = canvas.width, ch = canvas.height;
  ctx.clearRect(0, 0, cw, ch);
  ctx.imageSmoothingEnabled = false;

  ctx.save();
  ctx.translate(S.ox, S.oy);
  ctx.scale(S.scale, S.scale);

  // Base layer (lazy-render non-world layers; world falls back to biomes)
  const [W, H] = S.shape;
  if (S.layer === "world") {
    if (S.backdropImg && S.backdropImg.complete && S.backdropImg.naturalWidth > 0) {
      ctx.drawImage(S.backdropImg, 0, 0, W, H);
    } else {
      // Fallback: render biomes as the default world view
      const bioCanvas = ensureLayer("biomes");
      if (bioCanvas) ctx.drawImage(bioCanvas, 0, 0, W, H);
    }
  } else {
    const lc = ensureLayer(S.layer);
    if (lc) ctx.drawImage(lc, 0, 0, W, H);
  }

  // Search mask overlay
  if (S.searchMask) {
    ctx.globalAlpha = 0.55;
    const maskCanvas = buildMaskCanvas(S.searchMask);
    ctx.drawImage(maskCanvas, 0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  updateSelBox();
}

// Lazy build / cache for mask overlay canvas
let _maskCache = null;
let _maskCacheKey = null;
function buildMaskCanvas(mask) {
  if (_maskCache && _maskCacheKey === mask) return _maskCache;
  const [W, H] = S.shape;
  const off = document.createElement("canvas");
  off.width = W; off.height = H;
  const octx = off.getContext("2d");
  const imgData = octx.createImageData(W, H);
  const d = imgData.data;
  for (let i = 0; i < mask.length; i++) {
    if (mask[i]) {
      const j = i * 4;
      d[j] = 255; d[j + 1] = 40; d[j + 2] = 40; d[j + 3] = 160;
    }
  }
  octx.putImageData(imgData, 0, 0);
  _maskCache = off;
  _maskCacheKey = mask;
  return off;
}

function updateSelBox() {
  if (!S.selActive) { selBox.style.display = "none"; return; }
  const [sx0, sy0] = worldToScreen(S.selX0, S.selY0);
  const [sx1, sy1] = worldToScreen(S.selX1, S.selY1);
  const rect = canvas.getBoundingClientRect();
  const left = Math.min(sx0, sx1) - rect.left;
  const top  = Math.min(sy0, sy1) - rect.top;
  selBox.style.display = "block";
  selBox.style.left  = left + "px";
  selBox.style.top   = top  + "px";
  selBox.style.width  = Math.max(Math.abs(sx1 - sx0), 1) + "px";
  selBox.style.height = Math.max(Math.abs(sy1 - sy0), 1) + "px";
}

// ══════════════════════════════════════════════════════════════════════
// Coordinates
// ══════════════════════════════════════════════════════════════════════
function screenToWorld(sx, sy) {
  const rect = canvas.getBoundingClientRect();
  const x = (sx - rect.left - S.ox) / S.scale;
  const y = (sy - rect.top  - S.oy) / S.scale;
  return [Math.round(x), Math.round(y)];
}

function worldToScreen(wx, wy) {
  const rect = canvas.getBoundingClientRect();
  return [wx * S.scale + S.ox + rect.left, wy * S.scale + S.oy + rect.top];
}

function clampWorld(wx, wy) {
  return [Math.max(0, Math.min(S.shape[0] - 1, wx)),
          Math.max(0, Math.min(S.shape[1] - 1, wy))];
}

function resizeCanvas() {
  const rect = mapWrap.getBoundingClientRect();
  canvas.width  = rect.width;
  canvas.height = rect.height;
  fitMap();
  render();
}

function fitMap() {
  const cw = canvas.width, ch = canvas.height;
  const [W, H] = S.shape;
  S.scale = Math.min(cw / W, ch / H);
  S.ox = (cw - W * S.scale) / 2;
  S.oy = (ch - H * S.scale) / 2;
}

// Pixel Tooltip
// ══════════════════════════════════════════════════════════════════════
const FIELD_DISPLAY = {
  elev_m:   ["Elevation",    "m"],
  T_c:      ["Temperature",  "°C"],
  P_mm:     ["Precip",       "mm/yr"],
  cover:    ["Forest Cover", ""],
  salinity: ["Salinity",     "g/kg"],
  depth_m:  ["Depth",        "m"],
  hand_m:   ["HAND",         "m"],
  width_m:  ["River Width",  "m"],
  biome_sim:["Biome Sim",    ""],
};
const FIELD_ORDER = ["elev_m","T_c","P_mm","cover","salinity","depth_m","hand_m","width_m","biome_sim"];

function pixelAt(wx, wy) {
  const [W, H] = S.shape;
  const idx = wy * W + wx;
  const out = { x: wx, y: wy };
  for (const name of FIELD_ORDER) {
    if (S.fields[name] != null) out[name] = S.fields[name][idx];
  }
  // Masks
  if (S.fields.river != null) out.river = S.fields.river[idx];
  if (S.fields.lake  != null) out.lake  = S.fields.lake[idx];
  if (S.fields.ocean != null) out.ocean = S.fields.ocean[idx];
  if (S.fields.sea   != null) out.sea   = S.fields.sea[idx];
  if (S.fields.aquatic != null) out.aquatic = S.fields.aquatic[idx];
  // Biome name
  if (S.fields.biome != null) {
    out.biome_name = S.biomeNameById[S.fields.biome[idx]] || "?";
  }
  return out;
}

function showTooltip(data, ex, ey) {
  let html = "";
  if (data.biome_name) {
    html += `<div class="tt-biome">${data.biome_name}</div>`;
  }
  html += `<div class="tt-pos">x=${data.x} y=${data.y}</div>`;
  for (const f of FIELD_ORDER) {
    if (data[f] == null) continue;
    const [label, unit] = FIELD_DISPLAY[f] || [f, ""];
    html += `<div class="tt-field"><span class="tt-name">${label}</span><span class="tt-val">${fmtNum(data[f])} ${unit}</span></div>`;
  }
  const maskNames = { river: "River", lake: "Lake", ocean: "Ocean", sea: "Sea" };
  let maskVals = [];
  for (const [mk, ml] of Object.entries(maskNames)) {
    if (data[mk] != null) maskVals.push(`${ml}: ${data[mk]}`);
  }
  if (maskVals.length) {
    html += `<div class="tt-field"><span class="tt-name">Masks</span><span class="tt-val">${maskVals.join("  ")}</span></div>`;
  }
  if (data.aquatic != null) {
    html += `<div class="tt-field"><span class="tt-name">Aquatic</span><span class="tt-val">${data.aquatic}</span></div>`;
  }

  tooltip.innerHTML = html;
  tooltip.style.display = "block";

  const pad = 14;
  let tx = ex + pad, ty = ey + pad;
  const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
  if (tx + tw > window.innerWidth - 8)  tx = ex - tw - pad;
  if (ty + th > window.innerHeight - 8) ty = ey - th - pad;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tooltip.style.left = tx + "px";
  tooltip.style.top  = ty + "px";
}

function hideTooltip() {
  tooltip.style.display = "none";
}

// ══════════════════════════════════════════════════════════════════════
// Area Stats
// ══════════════════════════════════════════════════════════════════════
function computeAreaStats(x0, y0, x1, y1) {
  const [W, H] = S.shape;
  const xMin = Math.min(x0, x1), xMax = Math.max(x0, x1);
  const yMin = Math.min(y0, y1), yMax = Math.max(y0, y1);
  const bw = xMax - xMin + 1, bh = yMax - yMin + 1;
  const total = bw * bh;
  const isSingle = (bw === 1 && bh === 1);

  const out = { cells: total };
  if (total === 0) return out;

  const indices = [];
  for (let y = yMin; y <= yMax; y++) {
    for (let x = xMin; x <= xMax; x++) {
      indices.push(y * W + x);
    }
  }

  const fieldLabels = { elev_m:["Elevation","m"], T_c:["Temperature","°C"], P_mm:["Precip","mm/yr"],
    cover:["Forest Cover",""], salinity:["Salinity","g/kg"], depth_m:["Depth","m"],
    hand_m:["HAND","m"], width_m:["River Width","m"], biome_sim:["Biome Sim",""] };

  for (const [fname, finfo] of Object.entries(fieldLabels)) {
    const arr = S.fields[fname];
    if (!arr) continue;
    let sum = 0, min = Infinity, max = -Infinity;
    for (const idx of indices) {
      const v = arr[idx];
      sum += v;
      if (v < min) min = v;
      if (v > max) max = v;
    }
    const mean = sum / total;
    if (isSingle) {
      out[fname] = { mean, min, max };
    } else {
      out[fname] = { mean, min, max };
    }
  }

  // Biome histogram
  const biome = S.fields.biome;
  if (biome) {
    const hist = {};
    for (const idx of indices) {
      const name = S.biomeNameById[biome[idx]] || "?";
      hist[name] = (hist[name] || 0) + 1;
    }
    for (const k of Object.keys(hist)) hist[k] /= total;
    out.biome_hist = hist;
  }

  return out;
}

function renderAreaStatsPanel(data, x0, y0, x1, y1) {
  const w = Math.abs(x1 - x0) + 1, h = Math.abs(y1 - y0) + 1;
  const isSingle = (w === 1 && h === 1);
  let html = `<div class="sr-summary">Selection: ${w}×${h} (${data.cells} cells)</div>`;
  if (data.cells === 0) { areaStats.innerHTML = html; return; }

  const fieldLabels = { elev_m:["Elevation","m"], T_c:["Temperature","°C"], P_mm:["Precip","mm/yr"],
    cover:["Forest Cover",""], salinity:["Salinity","g/kg"], depth_m:["Depth","m"],
    hand_m:["HAND","m"], width_m:["River Width","m"], biome_sim:["Biome Sim",""] };

  for (const [fname, finfo] of Object.entries(fieldLabels)) {
    if (!data[fname]) continue;
    const [label, unit] = finfo;
    if (isSingle) {
      html += `<div class="stat-row"><span class="stat-key">${label}</span><span class="stat-val">${fmtNum(data[fname].mean)} ${unit}</span></div>`;
    } else {
      html += `<div class="stat-row"><span class="stat-key">${label}</span><span class="stat-val">${fmtNum(data[fname].mean)} ${unit}</span></div>`;
      html += `<div class="stat-row stat-sub"><span class="stat-key">min</span><span class="stat-val">${fmtNum(data[fname].min)}</span></div>`;
      html += `<div class="stat-row stat-sub"><span class="stat-key">max</span><span class="stat-val">${fmtNum(data[fname].max)}</span></div>`;
    }
  }

  if (data.biome_hist) {
    const sorted = Object.entries(data.biome_hist).sort((a, b) => b[1] - a[1]);
    html += `<div style="margin-top:6px;font-size:11px;color:#8899aa;">Biome Histogram</div>`;
    for (const [name, frac] of sorted) {
      const pct = (frac * 100).toFixed(1);
      html += `<div class="biome-bar">
        <div class="bb-fill" style="width:${Math.max(frac * 200, 3)}px;"></div>
        <div class="bb-label">${name}</div>
        <div class="bb-pct">${pct}%</div></div>`;
    }
  }
  areaStats.innerHTML = html;
}

// ══════════════════════════════════════════════════════════════════════
// Search (tokenizer + recursive-descent parser)
// ══════════════════════════════════════════════════════════════════════
const TOKEN_RE = /\s*(>=|<=|==|!=|[><&|!()]|"[^"]*"|'[^']*'|[A-Za-z_][A-Za-z0-9_]*|-?\d+\.?\d*)/g;

function tokenize(expr) {
  const toks = [];
  let m;
  while ((m = TOKEN_RE.exec(expr)) !== null) {
    toks.push(m[1]);
  }
  return toks;
}

class SearchParser {
  constructor(tokens, fields, n, biomeNameToId) {
    this.t = tokens;
    this.pos = 0;
    this.f = fields;
    this.n = n;
    this.biomeNameToId = biomeNameToId;
  }

  peek() { return this.pos < this.t.length ? this.t[this.pos] : null; }

  eat(tok) {
    if (this.peek() !== tok) throw new Error(`expected ${JSON.stringify(tok)}, got ${JSON.stringify(this.peek())}`);
    this.pos++;
  }

  parse() {
    const m = this.or_();
    if (this.pos < this.t.length) throw new Error(`trailing token: ${JSON.stringify(this.peek())}`);
    return m;
  }

  or_() {
    let m = this.and_();
    while (this.peek() === "|") {
      this.eat("|");
      const r = this.and_();
      for (let i = 0; i < this.n; i++) m[i] = m[i] | r[i];
    }
    return m;
  }

  and_() {
    let m = this.unary();
    while (this.peek() === "&") {
      this.eat("&");
      const r = this.unary();
      for (let i = 0; i < this.n; i++) m[i] = m[i] & r[i];
    }
    return m;
  }

  unary() {
    if (this.peek() === "!") {
      this.eat("!");
      const m = this.unary();
      for (let i = 0; i < this.n; i++) m[i] = m[i] ^ 1;
      return m;
    }
    if (this.peek() === "(") {
      this.eat("(");
      const m = this.or_();
      this.eat(")");
      return m;
    }
    return this.comparison();
  }

  comparison() {
    const name = this.peek();
    if (!name || !(name in this.f)) throw new Error(`unknown field: ${JSON.stringify(name)}`);
    this.pos++;
    const arr = this.f[name];
    const op = this.peek();
    const OPS = { ">": (a,b) => a > b, ">=": (a,b) => a >= b, "<": (a,b) => a < b,
                  "<=": (a,b) => a <= b, "==": (a,b) => a == b, "!=": (a,b) => a != b };
    if (!(op in OPS)) throw new Error(`expected operator, got ${JSON.stringify(op)}`);
    this.pos++;
    let raw = this.peek();
    this.pos++;

    const mask = new Uint8Array(this.n);
    let val;
    if (raw && (raw.startsWith('"') || raw.startsWith("'"))) {
      const word = raw.slice(1, -1);
      if (name === "biome") {
        if (!(word in this.biomeNameToId)) throw new Error(`unknown biome: ${JSON.stringify(word)}`);
        val = this.biomeNameToId[word];
      } else {
        throw new Error(`string value only allowed for biome, got ${name}`);
      }
    } else {
      val = parseFloat(raw);
    }

    const cmp = OPS[op];
    for (let i = 0; i < this.n; i++) mask[i] = cmp(arr[i], val) ? 1 : 0;
    return mask;
  }
}

function runSearch(expr) {
  const n = S.shape[0] * S.shape[1];
  const tokens = tokenize(expr);
  if (tokens.length === 0) throw new Error("Empty expression");

  // Build fields index for search
  const searchFields = {};
  for (const name of Object.keys(S.fields)) {
    if (name === "masks") continue; // use unpacked river/lake/ocean/sea instead
    searchFields[name] = S.fields[name];
  }

  // biome name → id mapping (numeric)
  const biomeNameToId = {};
  for (const [idStr, name] of Object.entries(S.biomeNames)) {
    biomeNameToId[name] = parseInt(idStr, 10);
  }

  const parser = new SearchParser(tokens, searchFields, n, biomeNameToId);
  const mask = parser.parse();

  // Count
  let count = 0;
  for (let i = 0; i < n; i++) if (mask[i]) count++;

  return { mask, count };
}

function computeSearchStats(mask, count) {
  const [W, H] = S.shape;
  const n = W * H;
  const out = { cells: count };
  if (count === 0) return out;

  // Bounding box
  let xMin = W, xMax = -1, yMin = H, yMax = -1;
  for (let i = 0; i < n; i++) {
    if (mask[i]) {
      const x = i % W, y = Math.floor(i / W);
      if (x < xMin) xMin = x;
      if (x > xMax) xMax = x;
      if (y < yMin) yMin = y;
      if (y > yMax) yMax = y;
    }
  }
  out.bbox = [xMin, yMin, xMax, yMax];

  // Field stats
  const fieldLabels = { elev_m:["Elevation","m"], T_c:["Temperature","°C"], P_mm:["Precip","mm/yr"],
    cover:["Forest Cover",""], salinity:["Salinity","g/kg"], depth_m:["Depth","m"],
    hand_m:["HAND","m"], width_m:["River Width","m"], biome_sim:["Biome Sim",""] };

  for (const [fname] of Object.entries(fieldLabels)) {
    const arr = S.fields[fname];
    if (!arr) continue;
    let sum = 0, min = Infinity, max = -Infinity;
    for (let i = 0; i < n; i++) {
      if (mask[i]) {
        const v = arr[i];
        sum += v;
        if (v < min) min = v;
        if (v > max) max = v;
      }
    }
    out[fname] = { mean: sum / count, min, max };
  }

  // Biome histogram
  const biome = S.fields.biome;
  if (biome) {
    const hist = {};
    for (let i = 0; i < n; i++) {
      if (mask[i]) {
        const name = S.biomeNameById[biome[i]] || "?";
        hist[name] = (hist[name] || 0) + 1;
      }
    }
    for (const k of Object.keys(hist)) hist[k] /= count;
    out.biome_hist = hist;
  }

  return out;
}

function renderSearchResults(data, expr) {
  if (data.cells === 0) {
    searchRes.innerHTML = `<div class="sr-summary">No cells match <code style="color:#e06060;">${expr}</code></div>`;
    return;
  }
  let html = `<div class="sr-summary">Query: <code style="color:#5dade2;">${expr}</code> — ${data.cells} cells</div>`;
  if (data.bbox) {
    html += `<div class="sr-summary">Bbox: [${data.bbox.join(", ")}]</div>`;
  }

  const fieldLabels = { elev_m:["Elevation","m"], T_c:["Temperature","°C"], P_mm:["Precip","mm/yr"],
    cover:["Forest Cover",""], salinity:["Salinity","g/kg"], depth_m:["Depth","m"],
    hand_m:["HAND","m"], width_m:["River Width","m"], biome_sim:["Biome Sim",""] };

  for (const [fname, finfo] of Object.entries(fieldLabels)) {
    if (!data[fname]) continue;
    const [label, unit] = finfo;
    html += `<div class="stat-row"><span class="stat-key">${label}</span><span class="stat-val">μ${fmtNum(data[fname].mean)} ${unit}</span></div>`;
    html += `<div class="stat-row stat-sub"><span class="stat-key">min</span><span class="stat-val">${fmtNum(data[fname].min)}</span></div>`;
    html += `<div class="stat-row stat-sub"><span class="stat-key">max</span><span class="stat-val">${fmtNum(data[fname].max)}</span></div>`;
  }

  if (data.biome_hist) {
    const sorted = Object.entries(data.biome_hist).sort((a, b) => b[1] - a[1]);
    html += `<div style="margin-top:6px;font-size:11px;color:#8899aa;">Biome Histogram</div>`;
    for (const [name, frac] of sorted) {
      const pct = (frac * 100).toFixed(1);
      html += `<div class="biome-bar"><div class="bb-fill" style="width:${Math.max(frac * 200, 3)}px;"></div><div class="bb-label">${name}</div><div class="bb-pct">${pct}%</div></div>`;
    }
  }
  searchRes.innerHTML = html;
}

// ══════════════════════════════════════════════════════════════════════
// Event Handlers
// ══════════════════════════════════════════════════════════════════════

// File loading
function handleFile(file) {
  if (!file.name.endsWith(".k11view")) {
    toast("Expected a .k11view file");
    return;
  }
  loadingEl.style.display = "block";
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      loadBundle(e.target.result);
      loadingEl.style.display = "none";
      filePicker.classList.add("hidden");
    } catch (err) {
      loadingEl.style.display = "none";
      toast("Failed to load bundle: " + err.message);
    }
  };
  reader.onerror = () => {
    loadingEl.style.display = "none";
    toast("Failed to read file");
  };
  reader.readAsArrayBuffer(file);
}

function loadBundle(buf) {
  const { header, rawFields, n } = parseBundle(buf);

  S.header = header;
  S.shape = header.shape;
  S.fields = decodeFields(header, rawFields);

  // Build biome mappings
  S.biomeNames = {};
  S.biomeNameById = {};
  S.biomeColors = {};
  for (const [idStr, name] of Object.entries(header.biome_names)) {
    const id = parseInt(idStr, 10);
    S.biomeNames[idStr] = name;
    S.biomeNameById[id] = name;
  }
  for (const [idStr, color] of Object.entries(header.biome_colors)) {
    S.biomeColors[parseInt(idStr, 10)] = color;
  }

  // Backdrop image (load async, optional)
  if (header.backdrop_png_b64) {
    S.backdropImg = new Image();
    S.backdropImg.onload = () => { if (S.layer === "world") render(); };
    S.backdropImg.src = "data:image/png;base64," + header.backdrop_png_b64;
  }

  // Hide loading UI
  loadingEl.style.display = "none";
  filePicker.classList.add("hidden");

  // UI — layers are lazy-rendered on demand
  S.layers = LAYERS;
  S.layerCanvas = {};
  buildLayerButtons();
  renderWorldStats(header.stats || {});
  resizeCanvas();
  fitMap();
  // Pre-warm the default layer (biomes → world)
  ensureLayer("biomes");
  render();
  S.searchMask = null;
  _maskCache = null;
  _maskCacheKey = null;
  searchRes.innerHTML = "";
  searchErr.textContent = "";
  areaStats.innerHTML = `<span style="color:#667788;font-size:12px;">Shift+drag on the map to select an area.</span>`;
}

// Expose for tests — save ref before window.loadBundle is overwritten
const _loadBundle = loadBundle;
window.loadBundle = function(arrayBuffer) {
  _loadBundle(arrayBuffer);
};

// File-picker UI
dropZone.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => {
  if (fileInput.files[0]) handleFile(fileInput.files[0]);
});

dropZone.addEventListener("dragover", (e) => {
  e.preventDefault();
  dropZone.classList.add("drag-over");
});
dropZone.addEventListener("dragleave", () => {
  dropZone.classList.remove("drag-over");
});
dropZone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropZone.classList.remove("drag-over");
  const file = e.dataTransfer.files[0];
  if (file) handleFile(file);
});

// Page-wide drop
document.addEventListener("dragover", (e) => { e.preventDefault(); });
document.addEventListener("drop", (e) => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file && file.name.endsWith(".k11view")) handleFile(file);
});

// Search
searchInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const expr = searchInput.value.trim();
    if (expr) doSearch(expr);
  }
});
$("search-submit").onclick = () => {
  const expr = searchInput.value.trim();
  if (expr) doSearch(expr);
};
$("search-clear").onclick = clearSearch;

for (const el of document.querySelectorAll(".examples span[data-expr]")) {
  el.onclick = () => {
    searchInput.value = el.dataset.expr;
    doSearch(el.dataset.expr);
  };
}

function doSearch(expr) {
  S.searchExpr = expr;
  searchErr.textContent = "";
  searchRes.innerHTML = `<span style="color:#667788;">Searching…</span>`;
  try {
    const { mask, count } = runSearch(expr);
    S.searchMask = mask;
    _maskCache = null;
    _maskCacheKey = null;
    const stats = computeSearchStats(mask, count);
    renderSearchResults(stats, expr);
    render();
  } catch (e) {
    S.searchMask = null;
    searchErr.textContent = e.message;
    searchRes.innerHTML = "";
    render();
  }
}

function clearSearch() {
  S.searchMask = null;
  S.searchExpr = null;
  _maskCache = null;
  _maskCacheKey = null;
  searchRes.innerHTML = "";
  searchErr.textContent = "";
  searchInput.value = "";
  render();
}

// Keyboard: Escape clears search
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") clearSearch();
});

// Canvas mouse events
canvas.addEventListener("mousedown", (e) => {
  if (!S.header) return;
  e.preventDefault();
  const sx = e.clientX, sy = e.clientY;
  if (e.shiftKey) {
    const [wx, wy] = clampWorld(...screenToWorld(sx, sy));
    S.shifting = true;
    S.selActive = true;
    S.selX0 = wx; S.selY0 = wy; S.selX1 = wx; S.selY1 = wy;
    updateSelBox();
    hideTooltip();
  } else {
    S.dragging = true;
    S.dragStartX = sx; S.dragStartY = sy;
    S.dragOX = S.ox; S.dragOY = S.oy;
    mapWrap.classList.add("grabbing");
    document.body.style.userSelect = "none";
  }
});

canvas.addEventListener("mousemove", (e) => {
  if (!S.header) return;
  const sx = e.clientX, sy = e.clientY;

  if (S.dragging) {
    S.ox = S.dragOX + (sx - S.dragStartX);
    S.oy = S.dragOY + (sy - S.dragStartY);
    render();
    hideTooltip();
    return;
  }

  if (S.shifting && S.selActive) {
    const [wx, wy] = clampWorld(...screenToWorld(sx, sy));
    S.selX1 = wx; S.selY1 = wy;
    updateSelBox();
    render();
    return;
  }

  if (S.hoverTimer) clearTimeout(S.hoverTimer);
  S.hoverTimer = setTimeout(() => {
    const [wx, wy] = clampWorld(...screenToWorld(sx, sy));
    try {
      const data = pixelAt(wx, wy);
      showTooltip(data, sx, sy);
    } catch (e) { hideTooltip(); }
  }, 200);
});

canvas.addEventListener("mouseup", (e) => {
  if (S.dragging) {
    S.dragging = false;
    mapWrap.classList.remove("grabbing");
    document.body.style.userSelect = "";
  }

  if (S.shifting && S.selActive) {
    S.shifting = false;
    S.selActive = false;
    selBox.style.display = "none";

    const x0 = Math.min(S.selX0, S.selX1), y0 = Math.min(S.selY0, S.selY1);
    const x1 = Math.max(S.selX0, S.selX1), y1 = Math.max(S.selY0, S.selY1);

    try {
      const data = computeAreaStats(x0, y0, x1, y1);
      renderAreaStatsPanel(data, x0, y0, x1, y1);
    } catch (e) {
      areaStats.innerHTML = `<span style="color:#e06060;">Error: ${e.message}</span>`;
    }
  }
});

canvas.addEventListener("mouseleave", () => {
  if (S.dragging) { S.dragging = false; mapWrap.classList.remove("grabbing"); document.body.style.userSelect = ""; }
  if (S.shifting && S.selActive) { S.shifting = false; S.selActive = false; selBox.style.display = "none"; }
  hideTooltip();
});

canvas.addEventListener("wheel", (e) => {
  if (!S.header) return;
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const wx = (mx - S.ox) / S.scale;
  const wy = (my - S.oy) / S.scale;
  const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  S.scale = Math.max(0.25, Math.min(S.scale * factor, 32));
  S.ox = mx - wx * S.scale;
  S.oy = my - wy * S.scale;
  render();

  if (!S.dragging && !S.shifting) {
    const [wwx, wwy] = clampWorld(...screenToWorld(e.clientX, e.clientY));
    if (S.hoverTimer) clearTimeout(S.hoverTimer);
    S.hoverTimer = setTimeout(() => {
      try { showTooltip(pixelAt(wwx, wwy), e.clientX, e.clientY); } catch (e) {}
    }, 200);
  }
}, { passive: false });

// Window resize
window.addEventListener("resize", () => {
  if (S.header) resizeCanvas();
});
</script>
</body>
</html>
